}

/* ═════════════════════ 보고용 분석: 월별 추이 · 조직별 비중 ═════════════════════ */

const payOf = (r) => (r.taxable_amt || 0) + (r.non_taxable_amt || 0);
const pctTxt = (v) => (v == null || !isFinite(v) ? '–' : `${v > 0 ? '+' : ''}${(v * 100).toFixed(1)}%`);
const ym = (m) => `${m.slice(2, 4)}.${m.slice(5, 7)}`;

/** 상여·성과급 지급항목 키 (상여총액 열이 없는 급여대장용) */
const BONUS_LABEL = /상여|성과급|인센티브|보너스/;
function bonusKeysOf(catalog) {
  const keys = new Set();
  Object.values(catalog || {}).forEach((cols) => cols.forEach((c) => { if (c.category === 'pay' && BONUS_LABEL.test(c.label)) keys.add(c.key); }));
  return keys;
}
/** 상여총액 = 급여대장 '상여총액' 열 값, 열이 없으면 상여·성과급 지급항목 합 */
const bonusOf = (r, keys) => (typeof r.bonus_amt === 'number' ? r.bonus_amt
  : keys ? [...keys].reduce((s, k) => s + (typeof r.items[k] === 'number' ? r.items[k] : 0), 0) : 0);

/** 월별 추이: [{ month, heads, total, tax, ntax, bonus, ded, net, perHead, mom }] (귀속월 오름차순) */
function monthlyTrend(rows, bonusKeys) {
  const by = new Map();
  for (const r of rows) {
    let a = by.get(r.pay_month);
    if (!a) by.set(r.pay_month, (a = { month: r.pay_month, emps: new Set(), total: 0, tax: 0, ntax: 0, bonus: 0, ded: 0, net: 0 }));
    a.emps.add(r.emp_no); a.total += payOf(r); a.tax += r.taxable_amt || 0; a.ntax += r.non_taxable_amt || 0;
    a.bonus += bonusOf(r, bonusKeys); a.ded += r.deduction_amt || 0; a.net += r.net_pay_amt || 0;
  }
  const list = [...by.values()].sort((a, b) => a.month.localeCompare(b.month)).map(({ emps, ...a }) => ({ ...a, heads: emps.size, perHead: emps.size ? a.total / emps.size : 0 }));
  list.forEach((a, i) => { a.mom = i > 0 && list[i - 1].total ? (a.total - list[i - 1].total) / list[i - 1].total : null; a.prevMonth = i > 0 ? list[i - 1].month : null; });
  return list;
}

/**
 * 조직별 비중 (선택 귀속월 기준) + 전월 대비
 *   heads = 연인원(월별 인원 합), perHead = 1인당 월평균 지급액 = 지급합계 ÷ 연인원
 *   전월 대비 = 선택 귀속월 중 가장 최근 달(latest) vs 데이터상 바로 앞 달(prev)
 */
function orgShare(selRows, allRows, dim, latest, prev) {
  const by = new Map();
  const get = (code) => { let a = by.get(code); if (!a) by.set(code, (a = { code, monthsEmp: new Map(), total: 0, latestTotal: 0, prevTotal: 0 })); return a; };
  for (const r of selRows) {
    const a = get(r[dim]); a.total += payOf(r);
    const set = a.monthsEmp.get(r.pay_month) || new Set(); set.add(r.emp_no); a.monthsEmp.set(r.pay_month, set);
  }
  for (const r of allRows) {
    if (r.pay_month !== latest && r.pay_month !== prev) continue;
    const a = get(r[dim]);
    if (r.pay_month === latest) a.latestTotal += payOf(r); else a.prevTotal += payOf(r);
  }
  const grand = [...by.values()].reduce((s, a) => s + a.total, 0);
  return [...by.values()].filter((a) => a.total || a.latestTotal || a.prevTotal).map((a) => {
    const heads = [...a.monthsEmp.values()].reduce((s, x) => s + x.size, 0);
    return { code: a.code, label: lab(dim, a.code), heads, avgHeads: a.monthsEmp.size ? heads / a.monthsEmp.size : 0, total: a.total,
      share: grand ? a.total / grand : 0, perHead: heads ? a.total / heads : 0, latestTotal: a.latestTotal, prevTotal: a.prevTotal,
      mom: prev && a.prevTotal ? (a.latestTotal - a.prevTotal) / a.prevTotal : null };
  }).sort((a, b) => b.total - a.total);
}

/** 엑셀 시트: aoa + 숫자/백분율 열 서식 */
function makeSheet(aoa, { num = [], pct = [], widths = [] } = {}) {
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let r = 1; r < aoa.length; r++) {
    num.forEach((c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && cell.t === 'n') cell.z = '#,##0'; });
    pct.forEach((c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && cell.t === 'n') cell.z = '0.0%'; });
  }
  ws['!cols'] = (aoa[0] || []).map((_, i) => ({ wch: widths[i] || 14 }));
  return ws;
}
/** 보고용 시트 2종 (월별 추이 · 조직별 비중) — 일반 엑셀과 보고용 요약 엑셀이 함께 사용 */
function reportSheets(trend, share, dimLabel, months, latest, prev) {
  const t = [['귀속월', '인원', '기본/기타 지급액(지급합계-상여)', '상여총액', '지급합계', '상여 비중', '과세총액', '비과세총액', '공제합계', '차인지급액', '1인당 지급액', '전월 대비 지급합계']]
    .concat(trend.map((a) => [a.month, a.heads, Math.max(0, a.total - a.bonus), a.bonus, a.total, a.total ? a.bonus / a.total : null,
      a.tax, a.ntax, a.ded, a.net, Math.round(a.perHead), a.mom == null ? null : a.mom]));
  const sh = [[dimLabel, '연인원', '월평균 인원', '지급합계', '비중', '1인당 월평균', `${latest || ''} 지급합계`, `${prev || '전월'} 지급합계`, '전월 대비']]
    .concat(share.map((a) => [a.label, a.heads, Math.round(a.avgHeads * 10) / 10, a.total, a.share, Math.round(a.perHead), a.latestTotal, a.prevTotal, a.mom == null ? null : a.mom]));
  sh.push(['합계', share.reduce((x, a) => x + a.heads, 0), null, share.reduce((x, a) => x + a.total, 0), 1, null, null, null, null]);
  return [
    { name: '월별 추이', ws: makeSheet(t, { num: [1, 2, 3, 4, 6, 7, 8, 9, 10], pct: [5, 11], widths: [10, 8, 22, 14, 16, 10, 16, 14, 14, 16, 14, 14] }) },
    { name: '조직별 비중', ws: makeSheet(sh, { num: [1, 3, 5, 6, 7], pct: [4, 8], widths: [20, 9, 11, 16, 8, 14, 16, 16, 10] }) },
  ];
}
/** 조회 범위·필터 문구 (엑셀 '조회 조건'·파일명) */
function exportMeta(viewer, months, filters) {
  return {
    scopeText: viewer.role === 'admin' ? '전체 (관리자)' : viewer.grants.map(describeGrant).join(' 또는 '),
    scopeShort: viewer.role === 'admin' ? '전체' : (viewer.grants.map((g) => g.business_unit || g.pay_basis || g.division).filter(Boolean).slice(0, 2).join('+') || '권한'),
    filterText: [`귀속월 ${[...months].sort().join(', ')}`, ...DIMS.filter((d) => filters[d.key].length).map((d) => `${d.label} = ${filters[d.key].map((v) => lab(d.key, v)).join(', ')}`)].join(' · '),
  };
}
function saveErrorToast(e, setToast) {
  const code = e && e.code;
  if (isXlsxNotReady(e)) { setToast({ ok: false, text: '엑셀 분석 엔진(SheetJS)을 로딩 중입니다. 잠시 후 다시 시도해 주세요.' }); window.LibLoader.load('xlsx').catch(() => {}); return; }
  if (code !== 'declined') setToast({ ok: false, text: code === 'unavailable' || code === 'not_granted' ? '이 화면에서는 파일 저장을 사용할 수 없습니다.' : code === 'rate_limited' ? '저장 확인 창이 이미 열려 있습니다. 잠시 후 다시 시도하세요.' : '엑셀을 만들지 못했습니다: ' + ((e && e.message) || code) });
}

/** 깔끔한 축 눈금: 최대값을 4칸으로 나눈 '보기 좋은' 간격 */
function niceStep(max, n = 4) {
  if (!(max > 0)) return 1;
  const raw = max / n, exp = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / exp;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * exp;
}

/**
 * 월별 인건비 추이 (SVG, 외부 라이브러리 없음) — 금액 기준 오버레이
 *   막대 전체(딥그린)  = 지급합계 → 막대 높이 = 지급합계 금액
 *   오버레이(코랄)     = 상여총액 → 막대 '바닥에서부터' 상여 금액만큼 (Y축 눈금과 1:1 비교, 쌓지 않음)
 *   막대 위 레이블     = 상여총액 금액 (상여가 없으면 비움)
 *   인원 = 오른쪽 보조축 점선 · 진한 막대 = 선택한 귀속월, 흐린 막대 = 선택하지 않은 귀속월
 *   X축 레이블은 모든 귀속월을 빠짐없이 표시 (칸이 좁으면 비스듬히 + 가로 스크롤)
 */
function TrendChart({ trend, selected }) {
  const [hover, setHover] = useState(null);
  const [asTable, setAsTable] = useState(false);
  if (!trend.length) return html`<p className="py-10 text-center text-muted">표시할 데이터가 없습니다.</p>`;
  const n = trend.length;
  const W = Math.max(760, 70 + 54 + n * 44);
  const m = { l: 62, r: 54, t: 28 };
  const band = (W - m.l - m.r) / n, barW = Math.min(48, band * 0.6);
  const tilt = band < 52;
  const plotH = 230, axisY = m.t + plotH, H = axisY + (tilt ? 46 : 28);
  const sY = niceStep(Math.max(...trend.map((a) => a.total), 1));
  const sH = niceStep(Math.max(...trend.map((a) => a.heads), 1) * 1.6);   // 인원 선은 막대 꼭대기와 겹치지 않게 중간 높이 (축은 0부터)
  const y = (v) => m.t + plotH * (1 - v / (sY * 4));
  const yh = (v) => m.t + plotH * (1 - v / (sH * 4));
  const xc = (i) => m.l + band * i + band / 2;
  const baseOf = (a) => Math.max(0, a.total - a.bonus);
  const headsPath = trend.map((a, i) => `${i ? 'L' : 'M'}${xc(i).toFixed(1)},${yh(a.heads).toFixed(1)}`).join(' ');
  const hv = hover != null ? trend[hover] : null;
  const isSel = (mo) => selected.includes(mo);
  const op = (i, mo) => (isSel(mo) ? (hover === i ? 0.85 : 1) : (hover === i ? 0.55 : 0.35));
  const showLabel = band >= 36;
  const Row = ({ dot, k, v, strong, tone }) => html`<div className=${cx('flex justify-between gap-3', strong && 'font-semibold')}>
    <span className="flex items-center gap-1.5 text-muted">${dot}${k}</span><span className=${cx('tabular-nums', tone)}>${v}</span></div>`;
  return html`
    <div>
      <div className="mb-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-muted">
        <span className="flex items-center gap-1.5"><i className="inline-block h-2.5 w-3 rounded-sm bg-ledger"></i>지급합계 (막대 전체 높이)</span>
        <span className="flex items-center gap-1.5"><i className="inline-block h-2.5 w-3 rounded-sm bg-coral"></i>상여총액 (막대 바닥부터 실제 금액 · 위 숫자)</span>
        <span className="flex items-center gap-1.5"><i className="inline-block w-4 border-t-2 border-dashed border-warn"></i>인원 (오른쪽 축)</span>
        <span className="flex items-center gap-1.5"><i className="inline-block h-2.5 w-3 rounded-sm bg-ledger"></i><i className="-ml-1 inline-block h-2.5 w-3 rounded-sm bg-ledger opacity-35"></i>진함 = 선택 귀속월 · 흐림 = 선택 안 함</span>
        <button className="ml-auto text-ledger underline" onClick=${() => setAsTable(!asTable)}>${asTable ? '차트로 보기' : '표로 보기'}</button>
      </div>
      ${asTable ? html`
        <div className="overflow-x-auto"><table className="w-full text-[13px]">
          <thead><tr className="whitespace-nowrap bg-paper text-xs text-muted">${['귀속월', '선택', '인원', '지급합계', '기본/기타 지급액', '상여총액', '상여 비중', '1인당', '전월 대비'].map((h, i) => html`<th key=${h} className=${cx('px-2 py-1.5 font-medium', i > 1 ? 'text-right' : 'text-left')}>${h}</th>`)}</tr></thead>
          <tbody>${trend.map((a) => html`<tr key=${a.month} className=${cx('border-b border-soft', !isSel(a.month) && 'text-muted')}><td className="px-2 py-1">${a.month}</td><td className="px-2">${isSel(a.month) ? '●' : ''}</td>
            <td className="px-2 text-right">${a.heads.toLocaleString()}</td><td className="px-2 text-right font-semibold">${won(a.total)}</td><td className="px-2 text-right">${won(baseOf(a))}</td>
            <td className="px-2 text-right text-coral-ink">${a.bonus ? won(a.bonus) : '0'}</td><td className="px-2 text-right">${a.total ? ((a.bonus / a.total) * 100).toFixed(1) + '%' : '–'}</td>
            <td className="px-2 text-right">${won(a.perHead)}</td><td className=${cx('px-2 text-right', a.mom > 0 ? 'text-bad' : a.mom < 0 ? 'text-ledger' : '')}>${pctTxt(a.mom)}</td></tr>`)}</tbody>
        </table></div>` : html`
        <div className="relative overflow-x-auto" onMouseLeave=${() => setHover(null)}>
          <svg viewBox=${`0 0 ${W} ${H}`} style=${{ minWidth: W > 760 ? `${W}px` : undefined }} className="block h-auto w-full" role="img"
            aria-label=${`월별 인건비 추이 ${trend[0].month}~${trend[n - 1].month}: ` + trend.map((a) => `${a.month} 지급합계 ${short(a.total)}원 중 상여총액 ${short(a.bonus)}원, 인원 ${a.heads}명${isSel(a.month) ? ' (선택)' : ''}`).join(', ')}>
            ${[0, 1, 2, 3, 4].map((k) => html`<g key=${'g' + k}>
              <line x1=${m.l} x2=${W - m.r} y1=${y(sY * k)} y2=${y(sY * k)} stroke=${k ? 'var(--rule-soft)' : 'var(--rule)'} />
              <text x=${m.l - 8} y=${y(sY * k) + 4} textAnchor="end" fontSize="11" fill="var(--muted)">${k ? short(sY * k) : '0'}</text>
              <text x=${W - m.r + 8} y=${yh(sH * k) + 4} fontSize="11" fill="var(--warn)">${k ? Math.round(sH * k).toLocaleString() + '명' : ''}</text>
            </g>`)}
            ${trend.map((a, i) => { const x = xc(i) - barW / 2, o = op(i, a.month), sel = isSel(a.month);
              return html`<g key=${a.month}>
                <rect x=${x} y=${y(a.total)} width=${barW} height=${Math.max(0, y(0) - y(a.total))} rx="3" fill="var(--ledger)" opacity=${o} />
                ${a.bonus > 0 && html`<rect x=${x + 3} y=${y(a.bonus)} width=${barW - 6} height=${Math.max(1.5, y(0) - y(a.bonus))} rx="2" fill="var(--coral)" opacity=${sel ? 0.95 : 0.6} />`}
                ${showLabel && a.bonus > 0 && html`<text x=${xc(i)} y=${y(a.total) - 7} textAnchor="middle" fontSize="10.5" fill="var(--coral-ink)" fontWeight=${sel ? 700 : 500} opacity=${sel ? 1 : 0.75}>${short(a.bonus)}원</text>`}
                <text x=${xc(i)} y=${axisY + 17} fontSize="11" textAnchor=${tilt ? 'end' : 'middle'} transform=${tilt ? `rotate(-40 ${xc(i)} ${axisY + 17})` : undefined}
                  fill=${sel ? 'var(--ink)' : 'var(--muted)'} fontWeight=${sel ? 700 : 400}>${ym(a.month)}</text>
              </g>`; })}
            <path d=${headsPath} fill="none" stroke="var(--warn)" strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" />
            ${trend.map((a, i) => html`<g key=${'p' + a.month}>
              <circle cx=${xc(i)} cy=${yh(a.heads)} r=${hover === i ? 4.5 : 3} fill="var(--sheet)" stroke="var(--warn)" strokeWidth="2" />
              <rect x=${m.l + band * i} y=${m.t - 22} width=${band} height=${axisY - m.t + 22} fill="transparent" onMouseEnter=${() => setHover(i)} onClick=${() => setHover(i)} />
            </g>`)}
          </svg>
          ${hv && html`
            <div className="pointer-events-none absolute top-1 z-10 w-[240px] rounded border border-rule bg-sheet px-3 py-2 text-[12.5px] shadow-lg"
              style=${{ left: `min(max(0px, calc(${(xc(hover) / W) * 100}% - 120px)), calc(100% - 240px))` }}>
              <div className="mb-1 flex items-center justify-between gap-2 font-semibold">${hv.month}
                <span className=${cx('rounded px-1.5 text-[11px] font-medium', isSel(hv.month) ? 'bg-ledger-tint text-ledger' : 'bg-paper text-muted')}>${isSel(hv.month) ? '선택한 귀속월' : '선택하지 않은 귀속월'}</span></div>
              <${Row} strong dot=${html`<i className="inline-block h-2 w-2 rounded-sm bg-ledger"></i>`} k="지급합계" v=${won(hv.total) + '원'} />
              <${Row} dot=${html`<i className="inline-block h-2 w-2"></i>`} k="기본/기타 지급액" v=${won(baseOf(hv)) + '원'} />
              <${Row} dot=${html`<i className="inline-block h-2 w-2 rounded-sm bg-coral"></i>`} k="상여총액" tone="font-semibold text-coral-ink"
                v=${hv.bonus ? `${won(hv.bonus)}원 (${((hv.bonus / (hv.total || 1)) * 100).toFixed(1)}%)` : '0원'} />
              <div className="my-0.5 border-t border-soft"></div>
              <${Row} dot=${html`<i className="inline-block w-2.5 border-t-2 border-dashed border-warn"></i>`} k="인원" v=${hv.heads.toLocaleString() + '명'} />
              <${Row} k="1인당 지급" v=${won(hv.perHead) + '원'} />
              <${Row} k="지급합계 전월 대비" v=${pctTxt(hv.mom)} tone=${hv.mom > 0 ? 'text-bad' : hv.mom < 0 ? 'text-ledger' : ''} />
            </div>`}
        </div>`}
    </div>`;
}

/** 조직별 인건비 비중 · 1인당 월평균 · 전월 대비 (행을 누르면 그 조직으로 필터) */
function ShareTable({ share, dimLabel, onDrill, latest, prev }) {
  if (!share.length) return html`<p className="py-10 text-center text-muted">표시할 데이터가 없습니다.</p>`;
  const maxShare = Math.max(...share.map((a) => a.share), 0.0001);   // 가장 큰 조직 = 꽉 찬 막대 (상대 비교)
  return html`
    <div className="overflow-x-auto">
      <table className="w-full text-[13px]">
        <thead><tr className="whitespace-nowrap bg-paper text-xs text-muted">
          <th className="px-2 py-1.5 text-left font-medium">${dimLabel}</th><th className="px-2 text-left font-medium">비중</th>
          <th className="px-2 text-right font-medium">지급합계</th><th className="px-2 text-right font-medium" title="지급합계 ÷ 연인원">1인당 월평균</th>
          <th className="px-2 text-right font-medium" title=${prev ? `${latest} vs ${prev}` : '이전 달 데이터 없음'}>전월 대비</th>
        </tr></thead>
        <tbody>
          ${share.map((a) => html`
            <tr key=${a.code ?? '_'} className=${cx('border-b border-soft', a.code != null && 'cursor-pointer hover:bg-ledger-tint')} onClick=${() => a.code != null && onDrill(a.code)}>
              <td className="whitespace-nowrap px-2 py-1.5"><b className="font-medium">${a.label}</b><div className="text-[11.5px] text-muted">월평균 ${a.avgHeads.toLocaleString(undefined, { maximumFractionDigits: 1 })}명</div></td>
              <td className="w-full min-w-[110px] px-2"><div className="flex items-center gap-2">
                <div className="h-2.5 flex-1 overflow-hidden rounded-sm bg-soft"><div className="h-full rounded-sm bg-ledger" style=${{ width: `${((a.share / maxShare) * 100).toFixed(1)}%` }}></div></div>
                <span className="w-12 whitespace-nowrap text-right tabular-nums">${(a.share * 100).toFixed(1)}%</span></div></td>
              <td className="whitespace-nowrap px-2 text-right tabular-nums">${short(a.total)}</td>
              <td className="whitespace-nowrap px-2 text-right tabular-nums">${short(a.perHead)}</td>
              <td className=${cx('whitespace-nowrap px-2 text-right tabular-nums', a.mom > 0.0005 ? 'text-bad' : a.mom < -0.0005 ? 'text-ledger' : 'text-muted')}>${pctTxt(a.mom)}</td>
            </tr>`)}
        </tbody>
      </table>
      <p className="mt-1.5 text-[11.5px] text-muted">1인당 월평균 = 지급합계 ÷ 연인원(월별 인원 합) · 전월 대비 = ${prev ? `${latest} 지급합계 vs ${prev}` : '비교할 이전 달 데이터 없음'} · 증가는 빨강, 감소는 초록 · 막대는 가장 큰 조직 대비 길이</p>
    </div>`;
}

/** 사원별 내역 — 급여대장의 모든 원본 열을 가로 스크롤로. 왼쪽 3열 고정, 머리글 2단(구분 + 항목명) */
function DetailTable({ rows, columns, months, filters, groupBy, viewer, setToast, reportExtra }) {
  const [cats, setCats] = useState({ summary: true, pay: true, deduction: true, info: false });
  const [hideEmpty, setHideEmpty] = useState(true);
  const [search, setSearch] = useState('');
  const [page, setPage] = useState(0);
  const [busy, setBusy] = useState(false);
  const wrap = useRef(null);

  // '값이 모두 0·빈칸'은 현재 페이지가 아니라 필터 결과 전체 기준 → 페이지를 넘겨도 열이 바뀌지 않음
  const nonEmpty = useMemo(() => { const s = new Set(); rows.forEach((r) => { for (const k in r.items) { const v = r.items[k]; if (v !== null && v !== 0 && v !== '') s.add(k); } }); return s; }, [rows]);
  const shown = columns.filter((c) => cats[c.category] && (!hideEmpty || nonEmpty.has(c.key)));
  const groups = []; shown.forEach((c) => { const l = groups[groups.length - 1]; if (l && l.cat === c.category) l.n++; else groups.push({ cat: c.category, n: 1 }); });
  const q = search.trim().toLowerCase();
  const list = useMemo(() => rows.filter((r) => !q || r.emp_no.toLowerCase().includes(q) || (r.emp_name || '').toLowerCase().includes(q))
    .sort((a, b) => b.pay_month.localeCompare(a.pay_month) || (b.taxable_amt + b.non_taxable_amt) - (a.taxable_amt + a.non_taxable_amt)), [rows, q]);
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  const p = Math.min(page, pages - 1);
  const pageRows = list.slice(p * PAGE, p * PAGE + PAGE);
  useEffect(() => setPage(0), [rows, q]);

  async function exportXlsx() {
    // 엑셀 = 권한 범위 ∩ 귀속월 ∩ 분류 필터 (화면과 같은 행) + 원본 열 전체. 검색어·표시 열 설정은 적용하지 않음
    setBusy(true);
    try {
      const { scopeText, scopeShort, filterText } = exportMeta(viewer, months, filters);
      const wb = E.buildPayrollWorkbook(rows, columns, { exportedBy: viewer.name, exportedAt: new Date(), scopeText, filterText, groupBy, label: lab });
      const extra = reportExtra ? reportExtra() : [];
      extra.forEach((x) => XLSX.utils.book_append_sheet(wb, x.ws, x.name));      // 보고용 시트: 월별 추이 · 조직별 비중
      const name = E.exportFileName(months, scopeShort);
      await saveFile(name, E.workbookToArray(wb));
      setToast({ ok: true, text: `${name} — ${rows.length.toLocaleString()}행 · 항목 ${columns.length}개 (시트: 급여대장 · 귀속월별 요약 · 조회 조건${extra.map((x) => ' · ' + x.name).join('')})` });
    } catch (e) {
      saveErrorToast(e, setToast);
    } finally { setBusy(false); }
  }

  const MATCH = { name: ['성명매칭', 'bg-warn-tint text-warn'], none: ['미매칭', 'bg-bad-tint text-bad'] };
  const th = 'whitespace-nowrap border-b border-rule px-3 py-1.5 text-xs font-medium';
  const td = 'whitespace-nowrap border-b border-soft px-3 py-1.5';
  return html`
    <section className="rounded-md border border-rule bg-sheet">
      <div className="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3">
        <b className="font-semibold">사원별 급여 내역</b>
        <span className="text-xs text-muted">${list.length.toLocaleString()}행 · 항목 ${shown.length}/${columns.length}개</span>
        ${CAT_ORDER.map((c) => html`
          <label key=${c} className="flex items-center gap-1 text-[13px]">
            <input type="checkbox" checked=${cats[c]} onChange=${(e) => setCats({ ...cats, [c]: e.target.checked })} />
            <span className=${cx('rounded px-1', CAT_TONE[c])}>${CAT_LABEL[c]}</span><span className="text-xs text-muted">${columns.filter((x) => x.category === c).length}</span>
          </label>`)}
        <label className="flex items-center gap-1 border-l border-rule pl-3 text-[13px]">
          <input type="checkbox" checked=${hideEmpty} onChange=${(e) => setHideEmpty(e.target.checked)} /> 값이 모두 0·빈칸인 항목 숨기기
        </label>
        <input value=${search} onChange=${(e) => setSearch(e.target.value)} placeholder="사번 또는 이름" aria-label="사원 검색"
          className="ml-auto rounded border border-rule px-2 py-1.5 text-[13px]" />
        <button onClick=${exportXlsx} disabled=${busy || !rows.length}
          className="rounded bg-ledger px-3.5 py-1.5 text-[13.5px] font-semibold text-ledger-ink disabled:opacity-40">${busy ? '엑셀 만드는 중…' : '엑셀 다운로드'}</button>
      </div>
      <p className="px-4 pb-2.5 text-xs text-muted">엑셀에는 화면 표시와 관계없이 급여대장의 <b className="text-ink">모든 항목이 원본 순서대로</b> 들어갑니다. 지금 보는 사람의 권한 범위와 위 필터에 해당하는 사원만 포함됩니다.</p>
      <div ref=${wrap} className="max-h-[70vh] overflow-auto border-t border-soft">
        <table className="dt min-w-full border-separate border-spacing-0 text-[13px]">
          <thead>
            <tr>
              <th className=${cx(th, 'stk c0 text-left')}>사원</th>
              <th className=${cx(th, 'stk c1')}></th>
              <th className=${cx(th, 'stk c2')}></th>
              <th colSpan="5" className=${cx(th, 'bg-paper text-left font-semibold text-ink')}>인원현황 결합 (귀속월 기준)</th>
              ${groups.map((g, i) => html`<th key=${i} colSpan=${g.n} className=${cx(th, 'border-l text-left font-semibold text-ink', CAT_TONE[g.cat])}>${CAT_LABEL[g.cat]}</th>`)}
            </tr>
            <tr>
              <th className=${cx(th, 'stk c0 text-left')}>귀속월</th>
              <th className=${cx(th, 'stk c1 text-left')}>사번</th>
              <th className=${cx(th, 'stk c2 text-left')}>성명</th>
              ${['급여지급기준', '사업부', '부문', '본부', '매칭'].map((h) => html`<th key=${h} className=${cx(th, 'bg-paper text-left')}>${h}</th>`)}
              ${shown.map((c) => html`<th key=${c.key} title=${c.code ? `${c.label} (${c.code})` : c.label}
                className=${cx(th, CAT_TONE[c.category], c.valueType === 'number' ? 'text-right' : 'text-left')}>${c.label}</th>`)}
            </tr>
          </thead>
          <tbody>
            ${pageRows.map((r) => html`
              <tr key=${r.pay_month + r.emp_no + r.pay_date} className="hover:bg-paper">
                <td className=${cx(td, 'stk c0 text-muted')}>${r.pay_month}</td>
                <td className=${cx(td, 'stk c1')} title=${r.emp_no}>${r.emp_no}</td>
                <td className=${cx(td, 'stk c2')} title=${r.emp_name || ''}>${r.emp_name}</td>
                <td className=${td}>${r.pay_basis || '–'}</td>
                <td className=${td}>${r.business_unit ? lab('business_unit', r.business_unit) : '–'}</td>
                <td className=${td}>${r.division || '–'}</td>
                <td className=${cx(td, 'text-muted')}>${r.hq || '–'}</td>
                <td className=${td} title=${r.match_method === 'name' ? '인원현황 사번 ' + r.hr_emp_no : ''}>
                  ${MATCH[r.match_method] && html`<span className=${cx('rounded px-1.5 py-0.5 text-xs font-medium', MATCH[r.match_method][1])}>${MATCH[r.match_method][0]}</span>`}</td>
                ${shown.map((c) => {
                  const v = r.items[c.key];
                  return c.valueType === 'number'
                    ? html`<td key=${c.key} className=${cx(td, 'text-right', v === 0 && 'text-rule')}>${v == null ? '' : won(v)}</td>`
                    : html`<td key=${c.key} className=${td}>${v == null ? '' : String(v)}</td>`;
                })}
              </tr>`)}
          </tbody>
        </table>
        ${!pageRows.length && html`<p className="px-4 py-8 text-center text-muted">검색 결과가 없습니다.</p>`}
      </div>
      <nav className="flex items-center justify-end gap-3 px-4 py-2 text-[13px]" aria-label="페이지">
        <button className="rounded border border-rule px-3 py-1 disabled:opacity-40" disabled=${p === 0} onClick=${() => { setPage(p - 1); wrap.current.scrollTop = 0; }}>이전</button>
        <span>${p + 1} / ${pages}</span>
        <button className="rounded border border-rule px-3 py-1 disabled:opacity-40" disabled=${p + 1 >= pages} onClick=${() => { setPage(p + 1); wrap.current.scrollTop = 0; }}>다음</button>
      </nav>
    </section>`;
}

/* ═════════════════════ 가입 예정자 등록 (자동 승인) ═════════════════════
   관리자가 이메일 + 조회 범위를 미리 등록 → 6자리 가입 코드 발급 → 팀원이 회원가입 때 코드 입력 → 즉시 승인
   이미 가입한 사람의 이메일을 등록하면 그 자리에서 바로 권한 적용 (DB 트리거) */
function InviteSection({ invites, opts, onSave, onDelete, setToast, accounts }) {
  const domain = CFG.LOGIN_EMAIL_DOMAIN;
  const [f, setF] = useState({ emails: '', name: '', role: 'viewer', pay_basis: '', business_unit: '', division: '', month_from: '', month_to: '' });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [copied, setCopied] = useState(null);
  const emails = [...new Set(f.emails.split(/[\s,;]+/).map((x) => x.trim().toLowerCase()).filter(Boolean)
    .map((x) => (x.includes('@') ? x : `${x}@${domain}`)))];
  const hasCond = ['pay_basis', 'business_unit', 'division'].some((k) => f[k].trim());
  async function save() {
    setErr(null);
    if (!emails.length) return setErr('이메일을 한 개 이상 입력해 주세요.');
    const bad = emails.filter((x) => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x) || !x.endsWith('@' + domain));
    if (bad.length) return setErr(`회사 이메일(@${domain})이 아닌 주소가 있습니다: ${bad.join(', ')}`);
    if (f.role !== 'admin' && !hasCond) return setErr('조회 범위(급여지급기준·사업부·부문 중 하나 이상)를 입력해 주세요.');
    const g = {}; ['pay_basis', 'business_unit', 'division', 'month_from', 'month_to'].forEach((k) => { const v = f[k].trim(); if (v) g[k] = v; });
    setBusy(true);
    try {
      const saved = await onSave(emails.map((email) => ({ email, name: emails.length === 1 && f.name.trim() ? f.name.trim() : null, role: f.role, grants: f.role === 'admin' ? [] : [g] })));
      const applied = saved.filter((x) => x.used_at).length;
      setToast({ ok: true, text: `가입 예정자 ${saved.length}명을 등록했습니다.${applied ? ` 이미 가입한 ${applied}명은 바로 권한이 적용됐습니다.` : ''} 아래 목록에서 가입 코드와 안내 문구를 복사해 전달하세요.` });
      setF({ ...f, emails: '', name: '' });
    } catch (e) { setErr(koError(e)); } finally { setBusy(false); }
  }
  const site = location.origin + location.pathname;
  const guide = (iv) => `[급여·인원 대시보드 가입 안내]\n사이트: ${site}\n1) [회원가입] 탭 → 회사 이메일 ${iv.email}\n2) 이름·비밀번호 입력\n3) 가입 코드: ${iv.code}\n가입하면 바로 담당 범위의 대시보드가 열립니다.`;
  async function copy(text, key) {
    try { await navigator.clipboard.writeText(text); setCopied(key); setTimeout(() => setCopied(null), 1800); }
    catch (e) { window.prompt('아래 내용을 복사하세요 (Ctrl+C)', text); }
  }
  const input = 'rounded border border-rule bg-sheet px-2 py-1.5 text-[13px]';
  return html`
    <section className="rounded-md border border-ledger bg-sheet">
      <header className="flex flex-wrap items-center gap-3 border-b border-soft px-4 py-3">
        <span className="font-semibold">가입 예정자 등록 (자동 승인)</span>
        <span className="text-[12.5px] text-muted">이메일과 조회 범위를 등록하면 가입 코드가 나옵니다. 팀원이 그 코드로 가입하면 즉시 승인 · 이미 가입했으면 등록 즉시 적용</span>
      </header>
      <div className="grid gap-3 p-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.3fr)]">
        <label className="flex flex-col gap-1 text-[13px]"><span className="text-xs text-muted">회사 이메일 (여러 명이면 줄바꿈·쉼표, 아이디만 써도 @${domain} 자동)</span>
          <textarea rows="4" className=${input} placeholder=${`heejjin@${domain}\nygsong\nhnshin`} value=${f.emails} onChange=${(e) => setF({ ...f, emails: e.target.value })}></textarea>
          ${emails.length > 0 && html`<span className="text-xs text-muted">${emails.length}명: ${emails.slice(0, 4).join(', ')}${emails.length > 4 ? ' …' : ''}</span>`}
        </label>
        <div className="flex flex-col gap-2 text-[13px]">
          <div className="flex flex-wrap gap-2">
            <label className="flex flex-col gap-1"><span className="text-xs text-muted">이름 (1명일 때)</span><input className=${cx(input, 'w-32')} value=${f.name} onChange=${(e) => setF({ ...f, name: e.target.value })} /></label>
            <label className="flex flex-col gap-1"><span className="text-xs text-muted">역할</span>
              <select className=${input} value=${f.role} onChange=${(e) => setF({ ...f, role: e.target.value })}><option value="viewer">담당자</option><option value="admin">관리자 (전체)</option></select></label>
          </div>
          ${f.role !== 'admin' && html`
            <div className="flex flex-wrap gap-2">
              ${DIMS.map((d) => html`<label key=${d.key} className="flex flex-col gap-1"><span className="text-xs text-muted">${d.label}</span>
                <input list=${'iv-' + d.key} className=${cx(input, 'w-36')} placeholder=${d.hint} value=${f[d.key]} onChange=${(e) => setF({ ...f, [d.key]: e.target.value })} />
                <datalist id=${'iv-' + d.key}>${(opts[d.key] || []).map(([c]) => html`<option key=${c} value=${c}>${lab(d.key, c)}</option>`)}</datalist></label>`)}
              <label className="flex flex-col gap-1"><span className="text-xs text-muted">귀속월 범위 (선택)</span>
                <span className="flex items-center gap-1"><input type="month" className=${input} value=${f.month_from} onChange=${(e) => setF({ ...f, month_from: e.target.value })} /> ~
                <input type="month" className=${input} value=${f.month_to} onChange=${(e) => setF({ ...f, month_to: e.target.value })} /></span></label>
            </div>`}
          ${err && html`<p role="alert" className="rounded border border-bad bg-bad-tint px-2 py-1.5 text-[13px]">${err}</p>`}
          <div><button disabled=${busy} onClick=${save} className="rounded bg-ledger px-4 py-1.5 font-semibold text-ledger-ink disabled:opacity-50">${busy ? '등록 중…' : '가입 예정자 등록'}</button></div>
        </div>
      </div>
      ${invites.length > 0 && html`
        <div className="overflow-x-auto border-t border-soft">
          <table className="w-full text-[13px]">
            <thead><tr className="whitespace-nowrap bg-paper text-xs text-muted">${['이메일', '이름', '조회 범위', '가입 코드', '상태', ''].map((h) => html`<th key=${h} className="px-3 py-2 text-left font-medium">${h}</th>`)}</tr></thead>
            <tbody>${invites.map((iv) => { const acc = accounts.find((a) => a.email === iv.email); return html`
              <tr key=${iv.email} className="border-b border-soft">
                <td className="whitespace-nowrap px-3 py-1.5">${iv.email}</td>
                <td className="px-3">${iv.name || (acc && acc.name) || '–'}</td>
                <td className="px-3">${iv.role === 'admin' ? '관리자 (전체)' : (iv.grants || []).map(describeGrant).join(' 또는 ') || '–'}</td>
                <td className="whitespace-nowrap px-3"><code className="rounded bg-paper px-1.5 py-0.5 font-mono tracking-widest">${iv.code}</code></td>
                <td className="whitespace-nowrap px-3">${iv.used_at ? html`<span className="rounded bg-ledger-tint px-1.5 py-0.5 text-xs text-ledger">승인 완료 ${new Date(iv.used_at).toLocaleDateString('ko-KR')}</span>`
                  : html`<span className="rounded bg-warn-tint px-1.5 py-0.5 text-xs text-warn">가입 대기</span>`}</td>
                <td className="whitespace-nowrap px-3"><span className="flex items-center justify-end gap-4">
                  ${!iv.used_at && html`<button className="text-ledger underline" onClick=${() => copy(guide(iv), iv.email)}>${copied === iv.email ? '복사됨 ✓' : '안내 문구 복사'}</button>`}
                  <${ConfirmButton} label="삭제" confirmLabel="등록 삭제" className="text-muted underline hover:text-bad" onConfirm=${() => onDelete(iv.email)} />
                </span></td>
              </tr>`; })}</tbody>
          </table>
          <p className="px-4 py-2 text-xs text-muted">등록을 삭제해도 이미 승인된 계정의 권한은 그대로입니다(권한은 아래 계정 목록에서 관리). 가입 코드는 관리자만 볼 수 있습니다.</p>
        </div>`}
    </section>`;
}

/* ═════════════════════ 권한 설정 (가입 계정 관리) ═════════════════════ */
function AccountsTab({ accounts, onUpdateAccount, me, rows, setToast, invites, onSaveInvites, onDeleteInvite }) {
  const [open, setOpen] = useState(null);
  const [draft, setDraft] = useState({});
  const months = useMemo(() => [...new Set(rows.map((r) => r.pay_month))].sort(), [rows]);
  // 값 후보: 업로드된 데이터의 값 + 이미 부여된 권한 값 (데이터가 없어도 직접 입력 가능)
  const opts = useMemo(() => {
    const o = {};
    DIMS.forEach((d) => {
      const m = new Map();
      rows.forEach((r) => r[d.key] != null && m.set(r[d.key], (m.get(r[d.key]) || 0) + 1));
      accounts.forEach((u) => u.grants.forEach((g) => g[d.key] && !m.has(g[d.key]) && m.set(g[d.key], 0)));
      o[d.key] = [...m].sort((a, b) => b[1] - a[1]);
    });
    return o;
  }, [rows, accounts]);
  const bad = draft.month_from && draft.month_to && draft.month_to < draft.month_from;
  const hasCond = DIMS.some((d) => draft[d.key]);
  const preview = hasCond && !bad && rows.length ? rows.filter((r) => canView(r, { role: 'viewer', grants: [draft] })) : null;
  const admins = accounts.filter((a) => a.role === 'admin').length;
  const pending = accounts.filter((a) => a.role !== 'admin' && !a.grants.length);

  const patch = async (id, fn) => {                   // 서버의 profiles 에 역할·권한 저장 (DB 가 관리자인지 다시 확인)
    const u = accounts.find((x) => x.id === id); const nu = fn(u);
    try { await onUpdateAccount(u, { role: nu.role, grants: nu.grants }); return true; }
    catch (e) { setToast({ ok: false, text: '저장하지 못했습니다: ' + koError(e) }); return false; }
  };
  function addGrant(id) {
    const g = {};
    [...DIMS.map((d) => d.key), 'month_from', 'month_to'].forEach((k) => { const v = (draft[k] || '').trim(); if (v) g[k] = v; });
    const u = accounts.find((x) => x.id === id);
    patch(id, (x) => ({ ...x, grants: [...x.grants, g] })).then((ok) => { if (!ok) return;
      setDraft({}); setOpen(null);
      setToast({ ok: true, text: `${u.name}(${id})에게 '${describeGrant(g)}' 조회 권한을 서버에 저장했습니다. 해당 사용자가 새로고침하면 바로 적용됩니다.` }); });
  }
  const status = (u) => u.role === 'admin' ? ['관리자', 'bg-ledger-tint text-ledger'] : u.grants.length ? ['사용 중', 'bg-sky-tint text-sky'] : ['승인 대기', 'bg-warn-tint text-warn'];
  const day = (iso) => (iso ? new Date(iso).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–');

  return html`
    <div className="flex flex-col gap-4">
      <${InviteSection} invites=${invites || []} opts=${opts} onSave=${onSaveInvites} onDelete=${onDeleteInvite} setToast=${setToast} accounts=${accounts} />
      ${pending.length > 0 && html`
        <p role="status" className="rounded-md border border-warn bg-warn-tint px-4 py-2.5 text-[13.5px]">
          <b>승인 대기 ${pending.length}명</b> — ${pending.map((u) => `${u.name}(${u.email || u.id})`).join(', ')}. 아래 목록의 [권한 추가] 또는 위 '가입 예정자 등록'에 이메일을 넣으면 바로 승인됩니다.</p>`}
      <section className="rounded-md border border-rule bg-sheet">
        <header className="flex flex-wrap items-center gap-3 border-b border-soft px-4 py-3">
          <span className="font-semibold">가입 계정 · 조회 권한</span>
          <span className="text-[13px] text-muted">계정 ${accounts.length}개 · 관리자 ${admins} · 승인 대기 ${pending.length}</span>
        </header>
        <p className="px-4 pt-3 text-[13px] text-muted">조건 하나 안에서 고른 값은 모두 만족해야 하고(그리고), 한 사람의 여러 조건 중 하나라도 맞으면 보입니다(또는). 예: <b className="text-ink">급여지급기준 = MS</b> 하나만 주면 MS 사업장 급여만 조회·엑셀 다운로드할 수 있습니다. 권한이 하나도 없는 일반 계정은 ‘승인 대기’ 화면만 봅니다.</p>
        ${accounts.map((u) => { const st = status(u); const self = u.id === me.id; return html`
          <div key=${u.id} className="grid items-start gap-3 border-t border-soft px-4 py-3 first-of-type:border-t-0 md:grid-cols-[230px_150px_1fr_auto]">
            <div>
              <div className="font-semibold">${u.name} ${self && html`<span className="text-xs font-normal text-muted">(나)</span>`}</div>
              <div className="text-xs text-muted">${u.email || u.id} · 가입 ${day(u.createdAt)} · 최근 로그인 ${day(u.lastLoginAt)}</div>
            </div>
            <div className="flex flex-col gap-1">
              <span className=${cx('w-fit rounded px-1.5 py-0.5 text-xs font-medium', st[1])}>${st[0]}</span>
              <select value=${u.role} disabled=${u.isMaster || self} className="w-fit rounded border border-rule px-1.5 py-0.5 text-[13px] disabled:opacity-50"
                title=${self ? '본인 역할은 바꿀 수 없습니다' : '관리자는 모든 데이터 조회·업로드·권한 설정이 가능합니다'}
                onChange=${(e) => patch(u.id, (x) => ({ ...x, role: e.target.value }))}>
                <option value="viewer">담당자</option><option value="admin">관리자</option>
              </select>
            </div>
            <div className="flex flex-wrap gap-1.5">
              ${u.role === 'admin' ? html`<span className="text-muted">전체 조회 · 업로드 · 권한 설정</span>`
                : !u.grants.length ? html`<span className="text-warn">권한 없음 — 승인 대기 화면만 보입니다</span>`
                : u.grants.map((g, i) => html`
                  <span key=${i} className="inline-flex items-center gap-1 rounded border border-rule bg-paper py-0.5 pl-2.5 pr-1 text-[13px]">${describeGrant(g)}
                    <button aria-label="권한 회수" className="px-1 text-muted hover:text-bad" onClick=${() => patch(u.id, (x) => ({ ...x, grants: x.grants.filter((_, j) => j !== i) }))}>×</button></span>`)}
            </div>
            <div className="flex flex-wrap items-center justify-end gap-x-3 gap-y-1 text-[13px]">
              ${u.role !== 'admin' && html`<button className="font-semibold text-ledger underline" onClick=${() => { setOpen(open === u.id ? null : u.id); setDraft({}); }}>${open === u.id ? '닫기' : '권한 추가'}</button>`}
            </div>
            ${open === u.id && html`
              <div className="col-span-full flex flex-wrap items-end gap-3 rounded border border-soft bg-paper p-3 text-[13px]">
                ${DIMS.map((d) => html`
                  <label key=${d.key} className="flex flex-col gap-1"><span className="text-xs text-muted">${d.label}</span>
                    <input list=${'dl-' + d.key} value=${draft[d.key] || ''} placeholder=${d.hint} className="w-44 rounded border border-rule px-1.5 py-1"
                      onChange=${(e) => setDraft({ ...draft, [d.key]: e.target.value })} />
                    <datalist id=${'dl-' + d.key}>${opts[d.key].map(([c, n]) => html`<option key=${c} value=${c}>${n ? `${lab(d.key, c)} · ${n}행` : lab(d.key, c)}</option>`)}</datalist>
                  </label>`)}
                <fieldset className="flex flex-col gap-1"><legend className="mb-1 text-xs text-muted">귀속월 범위 (비우면 제한 없음)</legend>
                  <div className="flex items-center gap-1">
                    <input type="month" aria-label="귀속월 시작" className="rounded border border-rule px-1.5 py-0.5" value=${draft.month_from || ''} onChange=${(e) => setDraft({ ...draft, month_from: e.target.value })} /> ~
                    <input type="month" aria-label="귀속월 끝" className="rounded border border-rule px-1.5 py-0.5" value=${draft.month_to || ''} onChange=${(e) => setDraft({ ...draft, month_to: e.target.value })} />
                  </div></fieldset>
                <div className="min-w-[220px] flex-1 text-muted" aria-live="polite">
                  ${bad ? '귀속월 끝이 시작보다 빠릅니다.' : !hasCond ? '급여지급기준·사업부·부문 중 하나 이상 입력하세요. 목록에서 고르거나 직접 입력할 수 있습니다.'
                    : preview ? html`현재 데이터(${months.join(', ') || '없음'}) 기준 <b className="text-ink">${new Set(preview.map((r) => r.pay_month)).size}개월 · ${preview.length}행 · ${short(preview.reduce((s, r) => s + r.taxable_amt + r.non_taxable_amt, 0))}원</b>이 보이게 됩니다.`
                    : '아직 업로드된 데이터가 없어 미리보기는 없습니다. 데이터가 올라오면 이 조건으로 바로 적용됩니다.'}
                </div>
                <button disabled=${!hasCond || bad} onClick=${() => addGrant(u.id)} className="rounded bg-ledger px-3 py-1.5 font-semibold text-ledger-ink disabled:opacity-40">권한 추가</button>
              </div>`}
          </div>`; })}
      </section>
      <p className="text-xs text-muted">계정·권한은 Supabase 서버에 저장되어 어느 PC에서 접속해도 같습니다. 권한 판정은 서버(DB)에서 하므로 브라우저를 조작해도 권한 밖 데이터는 내려가지 않습니다.
        팀원은 회원가입 화면에서 직접 가입합니다. 계정 삭제·비밀번호 초기화는 Supabase 대시보드 → Authentication → Users 에서 합니다.</p>
    </div>`;
}

/* ═════════════════════ 로그인 · 회원가입 · 승인 대기 · 비밀번호 변경 ═════════════════════ */
function AuthFrame({ children }) {
  return html`
    <div className="flex min-h-screen items-center justify-center bg-paper px-4 py-10 font-sans text-ink">
      <div className="w-full max-w-[420px]">
        <div className="mb-5 text-center">
          <div className="text-[20px] font-bold tracking-tight">급여 · 인원 열람 대시보드</div>
          <div className="text-[13px] text-muted">권한이 부여된 범위의 급여·인원 데이터만 조회합니다</div>
        </div>
        ${children}
      </div>
    </div>`;
}

/**
 * 로그인 · 회원가입 화면
 * ⚠ <form> 을 쓰지 않습니다: Claude 아티팩트 미리보기 같은 sandbox iframe(allow-forms 없음)에서는
 *   브라우저가 form 제출 자체를 막아 submit 이벤트가 발생하지 않기 때문 (이전 버전에서 버튼 무반응의 원인)
 *   → 버튼 onClick + 입력란 Enter 키로 처리
 */
/**
 * 로그인 · 회원가입 화면 (form 태그 없이 버튼 onClick + Enter 키 — sandbox iframe 호환)
 *   로그인 : 아이디(heejjin) 또는 회사 이메일(heejjin@cowave.kr) + 비밀번호
 *   회원가입: 회사 이메일 + 이름 + 비밀번호 + 가입 코드(관리자에게 받은 6자리, 있으면 즉시 승인)
 */
function AuthScreen({ onLogin, onSignup, notice }) {
  const [mode, setMode] = useState('login');
  const [f, setF] = useState({ id: '', email: '', name: '', pw: '', pw2: '', code: '' });
  const [msg, setMsg] = useState(notice ? { ok: true, text: notice } : null);
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (notice) setMsg({ ok: true, text: notice }); }, [notice]);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  async function submit() {
    if (busy) return;
    setMsg(null); setBusy(true);
    try {
      const err = mode === 'login' ? await onLogin(f.id.trim().toLowerCase(), f.pw) : await onSignup(f);
      if (err) setMsg({ ok: false, text: err });
    } catch (e) { setMsg({ ok: false, text: '처리 중 오류가 발생했습니다: ' + koError(e) }); }
    finally { setBusy(false); }
  }
  const onKey = (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } };
  const switchMode = (k) => { setMode(k); setMsg(null); setF((x) => ({ ...x, pw: '', pw2: '' })); };
  const input = 'w-full rounded border border-rule bg-sheet px-3 py-2';
  const domain = CFG.LOGIN_EMAIL_DOMAIN;
  return html`<${AuthFrame}>
    <div className="rounded-md border border-rule bg-sheet">
      <div className="grid grid-cols-2 border-b border-soft" role="tablist">
        ${[['login', '로그인'], ['signup', '회원가입']].map(([k, t]) => html`
          <button key=${k} type="button" role="tab" aria-selected=${mode === k} onClick=${() => switchMode(k)}
            className=${cx('border-b-[3px] py-3 font-semibold', mode === k ? 'border-ledger' : 'border-transparent text-muted')}>${t}</button>`)}
      </div>
      <div role="form" aria-label=${mode === 'login' ? '로그인' : '회원가입'} className="flex flex-col gap-3 p-5">
        ${msg && html`<p role=${msg.ok ? 'status' : 'alert'} className=${cx('rounded border px-3 py-2 text-[13.5px]', msg.ok ? 'border-ledger bg-ledger-tint' : 'border-bad bg-bad-tint')}>${msg.text}</p>`}
        ${mode === 'login' ? html`
          <label className="flex flex-col gap-1 text-[13.5px]">아이디 또는 회사 이메일
            <input className=${input} name="username" autoComplete="username" placeholder=${`heejjin 또는 heejjin@${domain}`} value=${f.id} onChange=${set('id')} onKeyDown=${onKey} autoFocus /></label>
          <label className="flex flex-col gap-1 text-[13.5px]">비밀번호
            <input className=${input} type="password" name="password" autoComplete="current-password" value=${f.pw} onChange=${set('pw')} onKeyDown=${onKey} /></label>
        ` : html`
          <label className="flex flex-col gap-1 text-[13.5px]">회사 이메일
            <input className=${input} type="email" name="email" autoComplete="email" placeholder=${`hong@${domain}`} value=${f.email} onChange=${set('email')} onKeyDown=${onKey} autoFocus /></label>
          <label className="flex flex-col gap-1 text-[13.5px]">이름
            <input className=${input} name="name" autoComplete="name" value=${f.name} onChange=${set('name')} onKeyDown=${onKey} /></label>
          <label className="flex flex-col gap-1 text-[13.5px]">비밀번호
            <input className=${input} type="password" name="password" autoComplete="new-password" value=${f.pw} onChange=${set('pw')} onKeyDown=${onKey} /></label>
          <label className="flex flex-col gap-1 text-[13.5px]">비밀번호 확인
            <input className=${input} type="password" name="password2" autoComplete="new-password" value=${f.pw2} onChange=${set('pw2')} onKeyDown=${onKey} /></label>
          <label className="flex flex-col gap-1 text-[13.5px]">가입 코드 <span className="text-xs text-muted">관리자에게 받은 6자리 — 있으면 가입과 동시에 자동 승인</span>
            <input className=${cx(input, 'font-mono uppercase tracking-widest')} name="code" maxLength="6" autoComplete="off" value=${f.code} onChange=${set('code')} onKeyDown=${onKey} /></label>
          <p className="text-xs text-muted">@${domain} 회사 이메일로만 가입할 수 있습니다 · 비밀번호는 영문과 숫자를 섞어 8자 이상.
            가입 코드가 없으면 가입 후 '승인 대기' 상태가 되고, 관리자가 등록하면 그 즉시 열립니다.</p>`}
        <button type="button" disabled=${busy} onClick=${submit} className="mt-1 rounded bg-ledger py-2.5 font-semibold text-ledger-ink disabled:opacity-50">
          ${busy ? '확인 중…' : mode === 'login' ? '로그인' : '가입하고 바로 시작'}</button>
        ${mode === 'login' && html`<p className="text-center text-xs text-muted">처음이신가요? 위 <button type="button" className="text-ledger underline" onClick=${() => switchMode('signup')}>회원가입</button>에서 회사 이메일로 직접 가입하세요.</p>`}
      </div>
    </div>
    <p className="mt-3 text-center text-xs text-muted">팀 공용 서버(Supabase)에 연결됨</p>
  <//>`;
}

function PendingScreen({ me, onLogout, onRefresh, onChangePassword, notice }) {
  return html`<${AuthFrame}>
    ${notice && html`<p role="status" className="mb-3 rounded border border-ledger bg-ledger-tint px-3 py-2 text-center text-[13.5px]">${notice}</p>`}
    <div className="rounded-md border border-rule bg-sheet p-6 text-center">
      <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-warn-tint text-[22px] text-warn" aria-hidden="true">⏳</div>
      <h1 className="text-[18px] font-semibold">관리자의 부문 권한 승인 대기 중입니다</h1>
      <p className="mt-2 text-[14px] text-muted"><b className="text-ink">${me.name}</b>(${me.email || me.id})님의 가입이 완료되었습니다.<br />관리자가 '가입 예정자'로 등록하면 그 즉시 승인되어 담당 범위의 데이터를 볼 수 있습니다. 관리자에게 이메일 주소를 알려 주세요.</p>
      <div className="mt-5 flex flex-wrap justify-center gap-2">
        <button className="rounded bg-ledger px-4 py-2 font-semibold text-ledger-ink" onClick=${onRefresh}>승인 상태 다시 확인</button>
        <button className="rounded border border-rule px-4 py-2" onClick=${onChangePassword}>비밀번호 변경</button>
        <button className="rounded border border-rule px-4 py-2" onClick=${onLogout}>로그아웃</button>
      </div>
    </div>
  <//>`;
}

function PasswordDialog({ me, forced, weak, onClose, onSave }) {
  const [f, setF] = useState({ cur: '', pw: '', pw2: '' });
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  async function submit() {
    if (busy) return;
    setErr(null); setBusy(true);
    try {
      if (!f.cur) return setErr('현재 비밀번호를 입력해 주세요.');
      const p = pwProblem(f.pw); if (p) return setErr(p);
      if (f.pw !== f.pw2) return setErr('새 비밀번호 확인이 일치하지 않습니다.');
      if (f.pw === f.cur) return setErr('현재와 다른 비밀번호를 입력해 주세요.');
      await onSave(f.cur, f.pw);
    } catch (e) { setErr(koError(e)); }
    finally { setBusy(false); }
  }
  const onKey = (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } };
  const input = 'w-full rounded border border-rule bg-sheet px-3 py-2';
  return html`
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4" role="dialog" aria-modal="true" aria-labelledby="pwdlg">
      <div role="form" aria-label="비밀번호 변경" className="flex w-full max-w-[380px] flex-col gap-3 rounded-md border border-rule bg-sheet p-5 font-sans text-ink shadow-xl">
        <h2 id="pwdlg" className="text-[16px] font-semibold">비밀번호 변경</h2>
        ${weak && html`<p className="text-[13px] text-warn">처음 받은 비밀번호(모두 같은 비밀번호)로 로그인했습니다. 다른 사람이 알 수 있으니 본인만 아는 비밀번호로 바꿔 주세요.</p>`}
        <label className="flex flex-col gap-1 text-[13.5px]">현재 비밀번호<input className=${input} type="password" autoComplete="current-password" value=${f.cur} onChange=${(e) => setF({ ...f, cur: e.target.value })} onKeyDown=${onKey} autoFocus /></label>
        <label className="flex flex-col gap-1 text-[13.5px]">새 비밀번호<input className=${input} type="password" autoComplete="new-password" value=${f.pw} onChange=${(e) => setF({ ...f, pw: e.target.value })} onKeyDown=${onKey} /></label>
        <label className="flex flex-col gap-1 text-[13.5px]">새 비밀번호 확인<input className=${input} type="password" autoComplete="new-password" value=${f.pw2} onChange=${(e) => setF({ ...f, pw2: e.target.value })} onKeyDown=${onKey} /></label>
        <p className="text-xs text-muted">영문과 숫자를 섞어 8자 이상</p>
        ${err && html`<p role="alert" className="rounded border border-bad bg-bad-tint px-3 py-2 text-[13.5px]">${err}</p>`}
        <div className="flex justify-end gap-2">
          ${!forced && html`<button type="button" className="rounded border border-rule px-4 py-2" onClick=${onClose}>${weak ? '나중에' : '취소'}</button>`}
          <button type="button" disabled=${busy} onClick=${submit} className="rounded bg-ledger px-4 py-2 font-semibold text-ledger-ink disabled:opacity-50">${busy ? '저장 중…' : '변경'}</button>
        </div>
      </div>
    </div>`;
}

/** 관리자용: DB 전체 → 누적 저장소(store) 형태 (업로드 미리보기·덮어쓰기 계산·누적 저장소 패널) */
function storeFromDb(hrRows, payRows, catalog, logs) {
  const st = emptyStore();
  hrRows.forEach((r) => { const rec = hrFromDb(r); st.hr[upsertKey(rec)] = { rec, seq: 0, file: r.file_name }; });
  payRows.forEach((rec) => { const k = upsertKey(rec); (st.pay[k] = st.pay[k] || { rows: [], seq: 0, file: rec._file }).rows.push(rec); });
  st.catalog = catalog;
  st.uploads = logs.map((l) => ({ seq: l.id, kind: l.kind, fileName: l.file_name, byMonth: l.by_month || {}, at: l.at }));
  st.seq = logs.reduce((mx, l) => Math.max(mx, l.id), 0);
  return st;
}

/** 설정이 잘못됐을 때 안내 화면 */
function SetupScreen({ problem }) {
  return html`<${AuthFrame}>
    <div role="alert" className="rounded-md border border-bad bg-sheet p-5 text-[14px]">
      <h1 className="mb-2 text-[17px] font-semibold">연결 설정을 확인해 주세요</h1>
      <p className="text-bad">${problem}</p>
      <ol className="mt-3 list-decimal pl-5 text-[13.5px] text-muted">
        <li>이 HTML 파일을 메모장(또는 VS Code)으로 엽니다.</li>
        <li>맨 위 <code>window.HR_CONFIG</code> 의 세 값을 고칩니다.</li>
        <li>저장한 뒤 다시 배포(또는 새로고침)합니다.</li>
      </ol>
      <pre className="mt-3 overflow-x-auto rounded bg-paper p-3 text-[12px]">SUPABASE_URL: 'https://프로젝트ID.supabase.co'
SUPABASE_KEY: 'sb_publishable_…'
LOGIN_EMAIL_DOMAIN: '회사도메인.co.kr'</pre>
    </div>
  <//>`;
}

/** 앱 껍데기: Supabase 로그인 세션 → 프로필(역할·권한) → 데이터(권한대로 걸러진 행) */
function App() {
  const problem = configProblem();
  const [session, setSession] = useState(undefined);      // undefined = 확인 중, null = 로그아웃
  const [me, setMe] = useState(null);
  const [accounts, setAccounts] = useState([]);
  const [db, setDb] = useState({ status: 'idle', rows: [], catalog: {}, store: null, error: null, progress: '' });
  const [pwOpen, setPwOpen] = useState(false);
  const [notice, setNotice] = useState(null);
  const [fatal, setFatal] = useState(null);
  const [invites, setInvites] = useState([]);              // 가입 예정자 (관리자만)
  const justSignedUp = useRef(false);

  useEffect(() => {
    if (problem) return;
    sb().auth.getSession().then(({ data, error }) => { if (error) setFatal(koError(error)); setSession(data ? data.session : null); })
      .catch((e) => { setFatal(koError(e)); setSession(null); });
    const { data } = sb().auth.onAuthStateChange((_ev, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);   // eslint-disable-line

  const uid = session && session.user ? session.user.id : null;

  /** 프로필 + (관리자면) 계정 목록 + 데이터 불러오기 */
  async function loadAll(userId) {
    try {
      const prof = await DB.myProfile(userId);
      if (!prof) { setFatal('계정 프로필을 찾을 수 없습니다. 관리자에게 문의하세요. (supabase_setup.sql 실행 여부 확인)'); return; }
      setMe(prof);
      setAccounts(prof.role === 'admin' ? await DB.profiles() : [prof]);
      if (prof.role === 'admin') DB.invites().then(setInvites).catch(() => setInvites([]));
      if (justSignedUp.current) {                          // 가입 직후: 자동 승인 여부 안내
        justSignedUp.current = false;
        setNotice(prof.role === 'admin' || prof.grants.length
          ? `회원가입이 완료되어 자동 승인되었습니다. ${prof.name}님, 바로 대시보드를 사용할 수 있습니다.`
          : `회원가입이 완료되었습니다. 가입 예정자로 등록되어 있지 않거나 가입 코드가 맞지 않아 '승인 대기' 상태입니다.`);
      }
      if (prof.role !== 'admin' && !prof.grants.length) { setDb({ status: 'ready', rows: [], catalog: {}, store: null, error: null, progress: '' }); return; }
      // 이미 화면이 떠 있으면(저장 후 다시 불러오기) 화면을 유지한 채 뒤에서 갱신, 처음이면 '불러오는 중' 화면
      setDb((d) => (d.status === 'ready' ? { ...d, error: null } : { ...d, status: 'loading', error: null, progress: '급여 데이터 불러오는 중…' }));
      const [pay, cols] = await Promise.all([
        DB.all('pay_rows', 'id', (n) => setDb((d) => (d.status === 'ready' ? d : { ...d, progress: `급여 데이터 불러오는 중… ${n.toLocaleString()}행` }))),
        DB.all('pay_columns', 'pay_month'),
      ]);
      const catalog = Object.fromEntries(cols.map((c) => [c.pay_month, c.columns]));
      const rows = pay.map(payFromDb);
      let store = null;
      if (prof.role === 'admin') {
        const [hr, logs] = await Promise.all([DB.all('hr_rows', 'pay_month'), DB.all('upload_log', 'id')]);
        store = storeFromDb(hr, rows, catalog, logs);
      }
      setDb({ status: 'ready', rows, catalog, store, error: null, progress: '' });
    } catch (e) {
      if (db.status === 'ready') throw e;                // 화면이 떠 있는 상태의 재조회 실패는 호출한 쪽(저장 버튼 등)에서 안내
      setDb((d) => ({ ...d, status: 'error', error: koError(e) }));
    }
  }
  useEffect(() => {
    if (!uid) { setMe(null); setAccounts([]); setDb({ status: 'idle', rows: [], catalog: {}, store: null, error: null, progress: '' }); return; }
    loadAll(uid);
  }, [uid]);   // eslint-disable-line

  const logout = async (msg) => { setPwOpen(false); try { await sb().auth.signOut(); } catch (e) { /* 무시 */ } setSession(null); setNotice(typeof msg === 'string' ? msg : null); };

  // 30분 동안 조작이 없으면 자동 로그아웃
  useEffect(() => {
    if (!me) return;
    let timer;
    const arm = () => { clearTimeout(timer); timer = setTimeout(() => logout('30분 동안 사용하지 않아 자동으로 로그아웃되었습니다.'), IDLE_MS); };
    const evs = ['mousedown', 'keydown', 'wheel', 'touchstart'];
    evs.forEach((ev) => window.addEventListener(ev, arm, { passive: true })); arm();
    return () => { clearTimeout(timer); evs.forEach((ev) => window.removeEventListener(ev, arm)); };
  }, [me && me.uuid]);   // eslint-disable-line

  async function login(id, pw) {
    if (!id) return '아이디를 입력해 주세요.';
    if (!pw) return '비밀번호를 입력해 주세요.';
    const lock = failState[id];
    if (lock && lock.until > Date.now()) return `로그인 시도가 많아 ${Math.ceil((lock.until - Date.now()) / 1000)}초 뒤에 다시 시도할 수 있습니다.`;
    const { data, error } = await sb().auth.signInWithPassword({ email: toEmail(id), password: pw });
    if (error) {
      if (/Invalid login credentials/i.test(error.message || '')) {
        const st = failState[id] = { count: ((lock && lock.count) || 0) + 1, until: 0 };
        if (st.count >= 5) { st.until = Date.now() + 30000; st.count = 0; return '비밀번호를 5회 틀려 30초 동안 로그인이 잠깁니다.'; }
        return `아이디 또는 비밀번호가 일치하지 않습니다. (${st.count}/5)`;
      }
      return koError(error);
    }
    delete failState[id];
    DB.rpc('touch_login').catch(() => {});
    setNotice('로그인되었습니다.');
    // 관리자가 처음 나눠준 비밀번호(abcd1234 등 단순 비밀번호)로 들어오면 변경 권유
    if (/^(abcd1234|12345678|password1|qwer1234)$/i.test(pw)) setPwOpen('weak');
    setSession(data.session);
    return null;
  }
  async function signup(f) {
    const email = (f.email || '').trim().toLowerCase(), name = (f.name || '').trim(), code = (f.code || '').trim().toUpperCase();
    const domain = CFG.LOGIN_EMAIL_DOMAIN.toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return '회사 이메일 주소를 정확히 입력해 주세요.';
    if (!email.endsWith('@' + domain)) return `회사 이메일(@${domain})로만 가입할 수 있습니다.`;
    if (!name) return '이름을 입력해 주세요.';
    const p = pwProblem(f.pw); if (p) return p;
    if (f.pw !== f.pw2) return '비밀번호 확인이 일치하지 않습니다.';
    if (code && !/^[A-Z0-9]{6}$/.test(code)) return '가입 코드는 6자리 영문·숫자입니다. (없으면 비워 두세요)';
    const { data, error } = await sb().auth.signUp({ email, password: f.pw,
      options: { data: { name, invite_code: code }, emailRedirectTo: location.origin + location.pathname } });
    if (error) return koError(error);
    if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return '이미 가입된 이메일입니다. [로그인] 탭에서 로그인해 주세요.';
    if (!data.session) {                                   // Supabase 에서 이메일 인증을 켜 둔 경우
      setNotice(`인증 메일을 ${email} 로 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.`);
      return null;
    }
    justSignedUp.current = true;                           // 프로필을 불러온 뒤 자동 승인 여부를 안내
    setSession(data.session);
    return null;
  }
  async function changePassword(cur, pw) {
    const { error: e1 } = await sb().auth.signInWithPassword({ email: toEmail(me.id), password: cur });
    if (e1) throw new Error(/Invalid login credentials/i.test(e1.message || '') ? '현재 비밀번호가 일치하지 않습니다.' : koError(e1));
    const { error: e2 } = await sb().auth.updateUser({ password: pw });
    if (e2) throw new Error(koError(e2));
    setPwOpen(false); setNotice('비밀번호를 변경했습니다.');
  }
  async function updateAccount(u, patch) {
    await DB.updateProfile(u.uuid, patch);
    setAccounts(await DB.profiles());
  }
  async function saveInvites(rows) {
    const saved = await DB.saveInvites(rows);
    const [inv, accs] = await Promise.all([DB.invites(), DB.profiles()]);   // 이미 가입한 사람은 권한이 바로 바뀌므로 함께 새로고침
    setInvites(inv); setAccounts(accs);
    return saved;
  }
  async function deleteInvite(email) { await DB.deleteInvite(email); setInvites(await DB.invites()); }
  /** 누적 저장: 이번에 바뀌는 귀속월만 '그 달 전체 상태'로 서버에 교체 (귀속월 단위로 한 번에 처리) */
  async function commitToDb(next, report, nameFallback, progress) {
    const months = [...new Set(report.flatMap((r) => Object.keys(r.byMonth)))].sort();
    const merged = matchStore(next, nameFallback);
    for (let i = 0; i < months.length; i++) {
      const mo = months[i];
      progress(`서버에 저장 중… ${mo} (${i + 1}/${months.length})`);
      const hr = Object.values(next.hr).filter((x) => x.rec.pay_month === mo).map(hrToDb);
      const pay = merged ? merged.merged.filter((r) => r.pay_month === mo).map(payToDb) : [];
      await DB.rpc('replace_month', { p_month: mo, p_hr: hr, p_pay: pay, p_columns: next.catalog[mo] || null });
    }
    progress('저장 이력 기록 중…');
    for (const r of report) await DB.rpc('log_upload', { p_kind: r.kind, p_file_name: r.fileName, p_by_month: r.byMonth });
    progress('서버에서 다시 불러오는 중…');
    await loadAll(uid);
  }
  async function deleteMonthDb(m) { await DB.rpc('delete_month', { p_month: m }); await loadAll(uid); }
  async function resetAllDb() { await DB.rpc('reset_all'); await loadAll(uid); }

  if (problem) return html`<${SetupScreen} problem=${problem} />`;
  if (fatal) return html`<${AuthFrame}><div role="alert" className="rounded-md border border-bad bg-sheet p-5 text-[14px]"><b>문제가 발생했습니다</b><p className="mt-1">${fatal}</p>
    <button className="mt-3 rounded border border-rule px-3 py-1.5" onClick=${() => { setFatal(null); logout(); }}>로그인 화면으로</button></div><//>`;
  if (session === undefined) return html`<p className="boot">로그인 상태를 확인하는 중…</p>`;
  const dialog = pwOpen && me && html`<${PasswordDialog} me=${me} forced=${false} weak=${pwOpen === 'weak'} onClose=${() => setPwOpen(false)} onSave=${changePassword} />`;
  if (!session) return html`<${AuthScreen} onLogin=${login} onSignup=${signup} notice=${notice} />`;
  if (!me) return html`<p className="boot">계정 정보를 불러오는 중…</p>`;
  if (me.role !== 'admin' && !me.grants.length) {
    return html`<${Fragment}>
      <${PendingScreen} me=${me} notice=${notice} onLogout=${() => logout()} onChangePassword=${() => setPwOpen(true)}
        onRefresh=${async () => { const p = await DB.myProfile(uid); setMe(p);
          if (p && (p.role === 'admin' || p.grants.length)) { setNotice('권한이 승인되었습니다.'); loadAll(uid); }
          else setNotice('아직 승인되지 않았습니다. 관리자에게 부문 권한을 요청해 주세요.'); }} />${dialog}<//>`;
  }
  if (db.status === 'loading' || db.status === 'idle') return html`<p className="boot">${db.progress || '데이터를 불러오는 중…'}</p>`;
  if (db.status === 'error') return html`<${AuthFrame}><div role="alert" className="rounded-md border border-bad bg-sheet p-5 text-[14px]"><b>데이터를 불러오지 못했습니다</b><p className="mt-1">${db.error}</p>
    <div className="mt-3 flex gap-2"><button className="rounded bg-ledger px-3 py-1.5 font-semibold text-ledger-ink" onClick=${() => loadAll(uid)}>다시 시도</button>
    <button className="rounded border border-rule px-3 py-1.5" onClick=${() => logout()}>로그아웃</button></div></div><//>`;
  return html`<${Fragment}>
    <${Workspace} key=${me.uuid} me=${me} welcome=${notice} accounts=${accounts} onUpdateAccount=${updateAccount} onLogout=${() => logout()}
      onChangePassword=${() => setPwOpen(true)} store=${db.store} dbRows=${db.rows} catalog=${db.catalog}
      onCommit=${commitToDb} onDeleteMonth=${deleteMonthDb} onResetAll=${resetAllDb}
      invites=${invites} onSaveInvites=${saveInvites} onDeleteInvite=${deleteInvite} />${dialog}<//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
};
</script>

<!-- ════════════════ ④ 라이브러리 로더: CDN 이중화(cdnjs → jsdelivr) + 로딩 검증 + 재시도 ════════════════
     · 게시된 아티팩트 페이지는 cdnjs.cloudflare.com · cdn.jsdelivr.net 스크립트만 허용(unpkg 차단)하므로 두 곳으로 이중화
     · 스크립트가 '로드됐다'가 아니라 전역 객체(React.createElement, XLSX.read)가 실제로 생겼는지까지 확인
     · URL 마다 20초 제한, 실패하면 다음 CDN. SheetJS 는 화면과 별도로 병렬 로딩되며 화면에서 재시도 가능 -->
<script>
(function () {
  'use strict';
  var SOURCES = {
    react: { label: 'React', test: function () { return !!(window.React && window.React.createElement); },
      urls: ['https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
             'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js'] },
    reactDom: { label: 'ReactDOM', test: function () { return !!(window.ReactDOM && window.ReactDOM.createRoot); },
      urls: ['https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
             'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js'] },
    supabase: { label: 'Supabase', test: function () { return !!(window.supabase && typeof window.supabase.createClient === 'function'); },
      urls: ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
             'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'] },
    xlsx: { label: 'SheetJS', test: function () { return !!(window.XLSX && typeof window.XLSX.read === 'function' && window.XLSX.utils); },
      urls: ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
             'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'] },
  };
  var status = {}, listeners = [], inflight = {};
  function emit() { var snap = JSON.parse(JSON.stringify(status)); listeners.forEach(function (fn) { try { fn(snap); } catch (e) { /* 구독자 오류 무시 */ } }); }
  function set(key, v) { status[key] = v; emit(); }
  function loadOne(url, test) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement('script'), done = false;
      var timer = setTimeout(function () { if (!done) { done = true; el.remove(); reject(new Error('시간 초과(20초)')); } }, 20000);
      el.src = url;
      el.onload = function () { if (done) return; done = true; clearTimeout(timer); test() ? resolve() : reject(new Error('스크립트는 받았지만 라이브러리가 초기화되지 않음')); };
      el.onerror = function () { if (done) return; done = true; clearTimeout(timer); el.remove(); reject(new Error('네트워크 오류 또는 차단됨')); };
      document.head.appendChild(el);
    });
  }
  function load(key) {
    var src = SOURCES[key];
    if (src.test()) { set(key, { state: 'ready', host: '이미 로드됨', tried: [] }); return Promise.resolve(); }
    if (inflight[key]) return inflight[key];
    var tried = [];
    set(key, { state: 'loading', tried: [] });
    var chain = src.urls.reduce(function (p, url) {
      return p.catch(function () {
        tried.push({ url: url, error: null });
        set(key, { state: 'loading', tried: tried.slice() });
        return loadOne(url, src.test).then(
          function () { set(key, { state: 'ready', host: new URL(url).host, tried: tried.slice() }); },
          function (e) { tried[tried.length - 1].error = e.message; throw e; });
      });
    }, Promise.reject(new Error('start')));
    inflight[key] = chain.catch(function (e) { set(key, { state: 'failed', tried: tried.slice() }); throw e; })
      .finally(function () { delete inflight[key]; });
    return inflight[key];
  }
  window.LibLoader = {
    load: load,
    get: function (key) { return status[key] ? JSON.parse(JSON.stringify(status[key])) : { state: 'idle', tried: [] }; },
    subscribe: function (fn) { listeners.push(fn); fn(JSON.parse(JSON.stringify(status))); return function () { listeners = listeners.filter(function (x) { return x !== fn; }); }; },
  };

  load('xlsx').catch(function () { /* 화면에서 안내·재시도 */ });
  load('react').then(function () { return load('reactDom'); }).then(function () { return load('supabase'); }).then(function () { window.__bootApp(); }).catch(function () {
    var r = function (k) { return (status[k] && status[k].tried || []).map(function (t) { return '<li>' + t.url + ' — ' + (t.error || '') + '</li>'; }).join(''); };
    document.getElementById('root').innerHTML = '<div class="boot"><p><b>화면 라이브러리(React·Supabase)를 불러오지 못했습니다.</b><br>회사 네트워크에서 CDN 접속이 막혀 있을 수 있습니다.</p>'
      + '<ul style="text-align:left;display:inline-block;font-size:13px">' + r('react') + r('reactDom') + r('supabase') + '</ul>'
      + '<p><button onclick="location.reload()" style="padding:6px 14px;border:1px solid #999;border-radius:4px;background:#fff">새로고침</button></p></div>';
  });
})();
</script>
