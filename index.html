    return null;
  },
  async profiles() {
    const { data, error } = await sb().from('profiles').select('*').order('created_at');
    if (error) throw error;
    return (data || []).map(toAccount);
  },
  async updateProfile(uuid, patch) {
    const { data, error } = await sb().from('profiles').update(patch).eq('id', uuid).select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('권한이 없어 수정되지 않았습니다. (관리자만 할 수 있는 작업입니다)');
  },

  async invites() { const { data, error } = await sb().from('signup_invites').select('*').order('created_at', { ascending: false }); if (error) throw error; return data || []; },
  async saveInvites(rows) { const { data, error } = await sb().from('signup_invites').upsert(rows, { onConflict: 'email' }).select(); if (error) throw error; return data || []; },
  async deleteInvite(email) { const { error } = await sb().from('signup_invites').delete().eq('email', email); if (error) throw error; },
  async rpc(fn, args) { const { data, error } = await sb().rpc(fn, args); if (error) throw error; return data; },

/** 권한 판정 — DB RLS 함수 app.can_view(pay_month, pay_basis, business_unit, division) 와 같은 규칙
 *  조건 1개 안의 값들은 AND, 한 사람의 여러 조건은 OR, 귀속월 범위(month_from~month_to) 포함 */
const normCode = (v) => (v == null ? '' : String(v).trim().toUpperCase());
/**
 * 권한 판정 — 규칙(조건) 하나 안에서는 '지정한 항목만' 비교하고, 지정하지 않은 항목은 전혀 보지 않음.
 *   예) { division: 'MS' }  → 부문이 MS 인 행 전부 (급여지급기준·사업부는 무엇이든 포함)
 *       { pay_basis: 'MS' } → 급여지급기준이 MS 인 행 전부 (부문·사업부는 무엇이든 포함)
 * 규칙이 여러 개면 하나라도 만족하면 조회 가능 (OR). 공백·대소문자 차이는 같은 값으로 봄.
 */
function canView(row, user) {
  if (!user) return false;
  if (user.role === 'admin') return true;
  return (user.grants || []).some((g) =>
    (!g.month_from || row.pay_month >= g.month_from) && (!g.month_to || row.pay_month <= g.month_to) &&
    DIMS.every((d) => !normCode(g[d.key]) || normCode(g[d.key]) === normCode(row[d.key])));
}

/**
 * 상단 필터 '고정' 항목: 권한 설정 기준으로만 판단 (데이터에 값이 하나뿐인 것과는 무관)
 *   모든 규칙이 같은 항목에 같은 값을 지정했을 때만 그 항목을 고정. 관리자는 고정 없음.
 *   { [dim]: { value, label } } 형태로 반환
 */
function grantLocks(user) {
  if (!user || user.role === 'admin' || !(user.grants || []).length) return {};
  const out = {};
  for (const d of DIMS) {
    const vals = user.grants.map((g) => normCode(g[d.key]));
    if (vals.every((v) => v) && new Set(vals).size === 1) {
      const raw = String(user.grants[0][d.key]).trim();
      out[d.key] = { value: raw, label: lab(d.key, raw) };
    }
  }
  return out;
}
const describeGrant = (g) => DIMS.filter((d) => g[d.key]).map((d) => `${d.label} = ${lab(d.key, g[d.key])}`).join(' 그리고 ')
  + (g.month_from || g.month_to ? ` (귀속월 ${g.month_from || '처음'}~${g.month_to || '현재'})` : '');

/** 파일 저장: Claude 뷰어 안에서는 downloads 기능(확인 창), 그 밖에서는 일반 다운로드 링크 */
async function saveFile(filename, bytes) {
  if (window.claude && typeof window.claude.use === 'function') {
    const dl = await window.claude.use('downloads');
    if (!dl) throw { code: 'unavailable' };
    return dl.save({ filename, data: new Blob([bytes]) });
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return { status: 'saved' };
}

/**
 * 업로드 파일을 바이트로 읽기
 *  ① FileReader.readAsArrayBuffer 를 먼저 실행하고 e.target.result(ArrayBuffer).byteLength 를 직접 검사
 *     (file.size 만 보고 미리 오류를 내지 않음)
 *  ② 결과는 즉시 복사(slice)해 보관 → 이후 원본 버퍼가 해제·전송돼도 영향 없음
 *  ③ 0바이트·실패면 file.arrayBuffer() 로 한 번 더 시도
 *  ④ 그래도 비면 원인별 안내
 * 주의: 최신 브라우저의 File 에는 bytes() 메서드가 기본으로 있으므로 'f.bytes' 존재 여부로 샘플을 구분하면 안 됨
 *       (이전 버전의 0바이트 오류 원인). 샘플 데이터는 { name, data } 형태로 별도 경로로 들어옵니다.
 */
const EMPTY_GUIDE = ['ERP에서 다시 내려받고, 다운로드가 끝난 뒤(브라우저 다운로드 표시줄 확인) 올려 주세요.',
  '파일 탐색기에서 파일 크기가 0KB가 아닌지 확인해 주세요.',
  'OneDrive·구글 드라이브 폴더의 파일이면 [이 장치에 항상 유지]로 내려받은 뒤 올려 주세요.',
  '메일·메신저 첨부나 압축 파일은 PC 폴더에 먼저 저장한 뒤 올려 주세요.'];
const BUSY_GUIDE = ['엑셀 등에서 이 파일을 열고 있다면 닫은 뒤 다시 올려 주세요.', '네트워크 드라이브의 파일이면 PC 폴더로 복사한 뒤 올려 주세요.'];
class FileReadError extends Error { constructor(message, guide) { super(message); this.guide = guide; } }

function readWithFileReader(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const buf = e && e.target ? e.target.result : reader.result;
      if (!(buf instanceof ArrayBuffer)) return reject(new Error('FileReader 결과가 ArrayBuffer 가 아님'));
      resolve(new Uint8Array(buf.slice(0)));            // 즉시 복사해 참조 끊김 방지
    };
    reader.onerror = () => reject(reader.error || new Error('FileReader 오류'));
    reader.onabort = () => reject(new Error('읽기가 중단됨'));
    reader.readAsArrayBuffer(file);
  });
}

async function readFileBytes(file) {
  if (!(file instanceof Blob)) throw new FileReadError('업로드 항목이 파일이 아닙니다. 파일을 다시 선택해 주세요.', null);
  let bytes = null, err = null;
  try { bytes = await readWithFileReader(file); } catch (e) { err = e; }
  if (!bytes || bytes.byteLength === 0) {
    try { const b = new Uint8Array(await file.arrayBuffer()); if (b.byteLength > 0) bytes = b; } catch (e) { err = err || e; }
  }
  if (bytes && bytes.byteLength > 0) return bytes;
  if (err && /NotReadable|NotFound|Security/i.test(err.name || '')) {
    throw new FileReadError('브라우저가 파일 내용을 읽지 못했습니다. 다른 프로그램이 파일을 사용 중이거나 접근할 수 없는 위치입니다.', BUSY_GUIDE);
  }
  if (file.size === 0) throw new FileReadError('파일 크기가 0바이트입니다. 내용이 없는 파일입니다.', EMPTY_GUIDE);
  throw new FileReadError(`파일 크기는 ${file.size.toLocaleString()}바이트로 표시되지만 내용을 읽지 못했습니다.`, [...BUSY_GUIDE, ...EMPTY_GUIDE.slice(0, 3)]);
}

/** SheetJS 로딩 상태 구독 (로더의 상태 변화를 React 상태로) */
function useLibStatus(key) {

  useEffect(() => window.LibLoader.subscribe((all) => setSt(all[key] || { state: 'idle', tried: [] })), [key]);

const isXlsxNotReady = (e) => e && (e.code === 'XLSX_NOT_READY' || /XLSX_NOT_READY/.test(e.message || ''));

/* ───────────────────────── 누적 저장소 (Accumulation + Upsert) ─────────────────────────
   store = {
     hr:      { [키]: { rec, seq, file } }        인원현황 1행 = 키 1개
     pay:     { [키]: { rows, seq, file } }       급여 — 같은 파일 안에서 같은 키인 행(예: 급여·상여 별도 지급)은 한 묶음으로 보관
     catalog: { [귀속월]: 급여대장 열 목록 }        같은 달에 파일이 여러 번 오면 열 합집합(원본 순서 유지)
     uploads: [{ seq, kind, fileName, byMonth: { [귀속월]: { inserted, updated } }, at }]   반영 이력
   }
   키 = 귀속월 | 사번  (사번이 없으면 귀속월 | 성명)
   규칙: 같은 키가 이미 있으면 '가장 나중에 저장한 파일'의 값으로 통째로 교체(Upsert), 없으면 추가. 다른 키는 절대 건드리지 않음. */
const emptyStore = () => ({ hr: {}, pay: {}, catalog: {}, uploads: [], seq: 0 });
const upsertKey = (r) => `${r.pay_month}|${r.emp_no ? 'E:' + r.emp_no : 'N:' + E.nameExactKey(r.emp_name)}`;
const mergeColumns = (a, b) => E.unionColumns({ 0: a || [], 1: b || [] }, ['0', '1']);   // 원본 순서 유지 합집합

/** 업로드 묶음을 저장소에 반영한 '새 저장소'와 파일별·귀속월별 신규/갱신 건수를 돌려줌 (원본 store 는 변경하지 않음) */
function applyUpload(store, staged) {
  const at = new Date().toISOString();
  const next = { hr: { ...store.hr }, pay: { ...store.pay }, catalog: { ...store.catalog }, uploads: store.uploads.slice(), seq: store.seq };
  const report = [];
  const bump = (byMonth, m, field) => { (byMonth[m] = byMonth[m] || { inserted: 0, updated: 0 })[field]++; };
  for (const f of staged.hrFiles) {                      // 파일 순서대로 → 같은 묶음 안에서도 나중 파일이 우선
    const seq = ++next.seq, byMonth = {};
    const recs = E.dedupHr(f.records).records;           // 파일 안 중복은 재직상태 우선으로 먼저 정리
    for (const r of recs) {
      const k = upsertKey(r);
      bump(byMonth, r.pay_month, k in next.hr ? 'updated' : 'inserted');
      next.hr[k] = { rec: r, seq, file: f.fileName };
    }
    report.push({ seq, kind: 'hr', fileName: f.fileName, byMonth, at });
  }
  for (const f of staged.payFiles) {
    const seq = ++next.seq, byMonth = {}, groups = {};
    for (const r of f.records) (groups[upsertKey(r)] = groups[upsertKey(r)] || []).push(r);
    for (const [k, rows] of Object.entries(groups)) {
      bump(byMonth, rows[0].pay_month, k in next.pay ? 'updated' : 'inserted');
      next.pay[k] = { rows, seq, file: f.fileName };
    }
    const cat = E.catalogByMonth([{ records: f.records, columns: f.columns }]);
    for (const [m, cols] of Object.entries(cat)) next.catalog[m] = mergeColumns(next.catalog[m], cols);
    report.push({ seq, kind: 'pay', fileName: f.fileName, byMonth, at });
  }
  next.uploads.push(...report);
  return { store: next, report };
}

/** 특정 귀속월 데이터만 저장소에서 삭제 (잘못 올린 달 정리용) */
function deleteMonth(store, month) {
  const keep = (obj) => Object.fromEntries(Object.entries(obj).filter(([k]) => !k.startsWith(month + '|')));
  const catalog = { ...store.catalog }; delete catalog[month];
  const seq = store.seq + 1;
  return { hr: keep(store.hr), pay: keep(store.pay), catalog, seq,
    uploads: [...store.uploads, { seq, kind: 'delete', fileName: `${month} 귀속월 삭제`, byMonth: {}, at: new Date().toISOString() }] };
}

/** 저장소 전체를 사번+귀속월 매칭 (화면·엑셀이 쓰는 최종 데이터) */
function matchStore(store, nameFallback) {
  const hr = Object.values(store.hr).map((x) => x.rec);
  const pay = Object.values(store.pay).flatMap((x) => x.rows);
  return hr.length || pay.length ? E.mergeHrPayroll(hr, pay, { nameFallback }) : null;
}

/** 두 번 눌러야 실행되는 버튼 (브라우저 confirm 창은 미리보기 iframe 에서 막힐 수 있어 화면 안에서 확인) */
function ConfirmButton({ label, confirmLabel, onConfirm, className, danger = true }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 5000); return () => clearTimeout(t); }, [armed]);
  return armed
    ? html`<span className="inline-flex items-center gap-1.5">
        <button className=${cx('rounded px-2.5 py-1 text-[13px] font-semibold', danger ? 'bg-bad text-sheet' : 'bg-ledger text-ledger-ink')} onClick=${() => { setArmed(false); onConfirm(); }}>${confirmLabel}</button>
        <button className="rounded border border-rule bg-sheet px-2.5 py-1 text-[13px]" onClick=${() => setArmed(false)}>취소</button></span>`
    : html`<button className=${className} onClick=${() => setArmed(true)}>${label}</button>`;
}

/* ───────────────────────── ② 샘플 데이터 생성기 ─────────────────────────
   실제 양식과 같은 구조의 가상 엑셀을 메모리에서 만들어, 업로드 파일과 똑같이 엔진에 넣습니다.
   - 9월 인원현황: 귀속월 열 없음(시트명 '26.09 인원현황'에서 추정)  / 10월 인원현황: '귀속월' 열 있음
   - 급여대장: 한글명·코드·타입설명 3행 헤더, 사업장 소계/총계 행, 가상 주민번호 열(자동 제외 확인용)
   - 시나리오: 10월 전배 1명(CC CTO→MS), 10월 급여 사번 오타 1명(성명 매칭), 동명이인 보류 1건,
               9월 퇴직 1명, 10월 입사 1명, 10월에만 생긴 '성과급' 항목 */
function makeSampleFiles() {
  let seed = 20260930;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const r10 = (n) => Math.round(n / 10) * 10;
  const ORG = [
    { bu: 'HQ', n: 22, divs: ['경영지원본부', '전략/기획본부', '사업부 직속'], pb: ['HQ', 'HQ안분대상', 'MS'], site: '4000' },
    { bu: 'MS', n: 26, divs: ['사업운영본부', '개발본부', '사업부직속'], pb: ['MS'], site: '4000' },
    { bu: 'CC', n: 30, divs: ['e마켓본부', '큐레이션본부', '사업부 직속'], pb: ['DW', 'DW', 'EN', 'CC'], site: '1000' },
    { bu: 'CC CTO', n: 24, divs: ['플랫폼개발본부', '서비스개발본부', 'CTO 직속'], pb: ['DW', 'EN', 'CC'], site: '1000' },
    { bu: 'PA', n: 16, divs: ['솔루션사업본부', '사업부 직속'], pb: ['PA'], site: '6000' },
    { bu: 'ST', n: 8, divs: ['사업부 직속'], pb: ['ST'], site: '7100' },
  ];
  const SUR = ['김', '이', '박', '최', '정', '강', '조', '윤', '장', '임', '한', '오', '서', '신', '권', '황', '안', '송', '류', '홍'];
  const GIV = ['민준', '서연', '도윤', '하은', '지호', '수아', '예준', '지유', '시우', '하린', '준서', '채원', '현우', '다은', '건우', '서윤', '우진', '예린', '선우', '유진', '지훈', '소율', '태윤', '나연'];
  const emps = []; let seq = 1;
  for (const o of ORG) for (let i = 0; i < o.n; i++) {
    emps.push({ no: `${['CW', 'DW', 'CC'][seq % 3]}${2020 + (seq % 6)}${String(seq).padStart(3, '0')}`, name: pick(SUR) + pick(GIV),
      bu: o.bu, div: pick(o.divs), pb: pick(o.pb), site: o.site, lead: i % 9 === 0, base: r10(3000000 + rnd() * 5500000), status: '재직' });
    seq++;
  }
  emps[3].name = '김민준'; emps[40].name = '김민준';                           // 동명이인
  const seen = {}; emps.forEach((e) => { seen[e.name] = (seen[e.name] || 0) + 1; });
  const idx = {}; emps.forEach((e) => { if (seen[e.name] > 1) { idx[e.name] = (idx[e.name] || 0) + 1; e.name += 'ABCDEFG'[idx[e.name] - 1]; } });
  const mover = emps.find((e) => e.bu === 'CC CTO');                           // 10월 전배
  const typo = emps.find((e) => e.bu === 'PA' && seen[e.name.replace(/[A-Z]$/, '')] === 1);   // 10월 사번 오타
  const leaver = emps.find((e) => e.bu === 'HQ' && e !== emps[3]);             // 9월 말 퇴직
  const joiner = { no: 'CW2026901', name: '나신입', bu: 'CC', div: 'e마켓본부', pb: 'DW', site: '1000', lead: false, base: 3300000, status: '재직' };

  // 실제 인원현황 양식과 같은 헤더 구성 (9월 파일은 귀속월 열 없음, 10월 파일은 맨 끝에 귀속월)
  const hrHead = ['사원 번호', '이름', '입사일', '사용자 유형', '회사', '부문', '사업부', '본부', '팀', '사업장', '부서', '휴대폰', '로그인 아이디', '재직 상태', '급여 지급기준(사업장)', 'HQ 세부 안분', '안분세부', '비용귀속'];
  const hrRow = (e) => [e.no, e.name, '2022-03-02', '정규직', 'CW', e.bu.split(' ')[0], e.bu, e.div, e.div.replace('본부', '팀'), '(주)샘플회사', e.div.replace('본부', '팀'),
    '010-0000-0000', 'user@example.com', e.status, e.pb, '', e.pb === 'HQ안분대상' ? 'HQ' : e.pb, 1];
  const sepHr = [hrHead, ...emps.map(hrRow)];
  const octEmps = emps.filter((e) => e !== leaver).map((e) => e === mover ? { ...e, bu: 'MS', div: '사업운영본부', pb: 'MS', site: '4000' } : e).concat([joiner]);
  const octHr = [[...hrHead, '귀속월'], ...octEmps.map((e) => [...hrRow(e), '2026-10'])];

  const COLS = [['사원코드', 'EMP_CD'], ['사원명', 'KOR_NM'], ['주민번호', 'RSRG_NO'], ['부서', 'DEPT_NM'], ['사업장', 'DIV_CD'], ['귀속월', 'MON'], ['지급일자', 'PAY_DT'],
    ['과세총액', 'TSUM'], ['비과세총액', 'NTSUM'], ['급여총액', 'TPAY_AM'], ['상여총액', 'TBON_AM'],
    ['기본급', 'P2P00'], ['식대', 'P2P01'], ['연차수당', 'P2P04'], ['직책수당', 'P2P06'], ['고정연장근로수당', 'P2P10'], ['통신비', 'P2P23'], ['상여', 'P2V00'], ['성과급', 'P2V03'], ['지급합계', 'P2SUM'],
    ['국민연금', 'P3S00'], ['건강보험', 'P3S10'], ['고용보험', 'P3S20'], ['장기요양보험료', 'P3SR1'], ['사내대출이자', 'P3S61'], ['소득세', 'P3T00'], ['지방소득세', 'P3T10'], ['공제합계', 'P3TT'], ['차인지급액', 'TOTAL']];
  const SITE = { '1000': '(주)샘플회사 목동지점', '4000': '(주)샘플회사', '6000': '(주)샘플회사 플레이오토지점', '7100': '(주)샘플회사 스윗트래커지점' };
  function payroll(list, mm, payDt, withPerf) {
    const cols = withPerf ? COLS : COLS.filter((c) => c[1] !== 'P2V03');
    const rows = [cols.map((c) => c[0]), cols.map((c) => c[1]), cols.map((c) => (/^(T|P)\w*(SUM|AM|TT|\d)|TOTAL/.test(c[1]) ? '타입 : 숫자\n길이 : ' : '타입 : 문자\n길이 : '))];
    const tot = { n: 0, gross: 0 };
    for (const site of Object.keys(SITE)) {
      const group = list.filter((e) => e.site === site); if (!group.length) continue;
      let sub = 0;
      for (const e of group) {
        const v = { P2P00: e.base, P2P01: 200000, P2P04: rnd() < 0.15 ? r10(e.base * 0.03) : 0, P2P06: e.lead ? 300000 : 0,
          P2P10: r10(e.base * 0.07), P2P23: pick([30000, 5000]), P2V00: 100000, P2V03: withPerf && rnd() < 0.3 ? r10(e.base * 0.5) : 0 };
        const tax = v.P2P00 + v.P2P04 + v.P2P06 + v.P2P10 + v.P2P23 + v.P2V00 + v.P2V03, ntax = v.P2P01;
        const bonus = v.P2V00 + v.P2V03, gross = tax + ntax - bonus;
        const d = { P3S00: r10(Math.min(e.base, 6170000) * 0.045), P3S10: r10(e.base * 0.03545), P3S20: r10(tax * 0.009), P3S61: rnd() < 0.08 ? 52000 : 0 };
        d.P3SR1 = r10(d.P3S10 * 0.1295); d.P3T00 = r10(tax * (tax > 7000000 ? 0.12 : 0.05)); d.P3T10 = r10(d.P3T00 * 0.1);
        const ded = d.P3S00 + d.P3S10 + d.P3S20 + d.P3S61 + d.P3SR1 + d.P3T00 + d.P3T10;
        // 오타 시나리오: 10월 급여에 사번 끝자리 숫자를 하나 더 입력
        const val = { EMP_CD: e === typo && mm === '10' ? e.no + '0' : e.no, KOR_NM: e.name, RSRG_NO: '******-*******', DEPT_NM: e.div.replace('본부', '팀'),
          DIV_CD: site, MON: mm, PAY_DT: payDt, TSUM: tax, NTSUM: ntax, TPAY_AM: gross, TBON_AM: bonus, P2SUM: tax + ntax, P3TT: ded, TOTAL: tax + ntax - ded, ...v, ...d };
        rows.push(cols.map((c) => val[c[1]]));
        sub += gross; tot.n++; tot.gross += gross;
      }
      rows.push(cols.map((c) => (c[1] === 'EMP_CD' ? SITE[site] : c[1] === 'KOR_NM' ? `${mm}월 소계(${group.length}명)` : c[1] === 'TPAY_AM' ? sub : c[1] === 'PAY_DT' ? 'ZZ' : null)));
    }
    rows.push(cols.map((c) => (c[1] === 'EMP_CD' ? '총계' : c[1] === 'KOR_NM' ? `${mm}월 (${tot.n}명)` : c[1] === 'TPAY_AM' ? tot.gross : c[1] === 'PAY_DT' ? 'ZZZ' : null)));
    return rows;
  }
  const sepPay = payroll(emps, '09', '20260923', false);
  // 10월 급여: 동명이인 김민준A·B 의 급여가 사번 없이 '김민준' 한 행으로 들어온 상황 → 후보가 2명이라 성명 매칭 보류
  const octPayList = octEmps.filter((e) => e !== emps[3] && e !== emps[40]);
  octPayList.push({ ...emps[3], no: 'XX2026777', name: '김민준' });
  const octPay = payroll(octPayList, '10', '20261023', true);

  const book = (sheet, aoa) => { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sheet); return new Uint8Array(XLSX.write(wb, { type: 'array', bookType: 'xlsx' })); };
  return {
    hr: [{ name: '샘플_인원현황_26_09_30.xlsx', bytes: book('26.09 인원현황', sepHr) }, { name: '샘플_인원현황_2026-10.xlsx', bytes: book('인원현황', octHr) }],
    pay: [{ name: '샘플_급여대장_2026-09.xlsx', bytes: book('Sheet1', sepPay) }, { name: '샘플_급여대장_2026-10.xlsx', bytes: book('Sheet1', octPay) }],
    note: { mover: `${mover.name}(${mover.no})`, typo: `${typo.name}(${typo.no})` },
  };
}

/* ───────────────────────── ③ React 화면 ───────────────────────── */

function Workspace({ me, welcome, accounts, onUpdateAccount, onLogout, onChangePassword, store, dbRows, catalog, onCommit, onDeleteMonth, onResetAll, invites, onSaveInvites, onDeleteInvite }) {
  const [saving, setSaving] = useState(null);           // 저장 진행 문구 (null = 저장 중 아님)
  const [files, setFiles] = useState({ hr: [], pay: [] });
  const [catOverrides, setCatOverrides] = useState({});
  const [nameFallback, setNameFallback] = useState(true);
  const [viewerId, setViewerId] = useState(me.id);     // 관리자만: 다른 사용자 화면 미리보기
  const [tab, setTab] = useState(me.role === 'admin' ? 'upload' : 'dash');
  const [months, setMonths] = useState([]);
  const [filters, setFilters] = useState(blankDims());
  const [groupBy, setGroupBy] = useState('business_unit');
  const [toast, setToast] = useState(welcome ? { ok: true, text: welcome } : null);
  const [loadErrors, setLoadErrors] = useState([]);   // [{ name, message, guide }]
  const [resetKey, setResetKey] = useState(0);          // 초기화 시 파일 선택창(input)까지 새로 만들기 위한 키
  const xlsx = useLibStatus('xlsx');
  const xlsxReady = xlsx.state === 'ready';

  // 지금 화면의 기준이 되는 사람: 일반 사용자는 항상 본인, 관리자는 '미리보기'로 다른 사용자 선택 가능
  const viewer = (me.role === 'admin' && accounts.find((u) => u.id === viewerId)) || me;
  const isAdmin = viewer.role === 'admin';

  // 업로드 파일 → 파싱 → 매칭 (파일·옵션이 바뀔 때마다 다시 계산)
  // 파일마다 따로 파싱: 한 파일이 실패해도 나머지는 계속 처리하고, 실패 파일은 진단 정보를 보여줌
  const parsed = useMemo(() => {
    const failed = [];
    const run = (list, fn) => list.map((src) => {
      try { return { src, file: fn(src) }; }
      catch (e) { failed.push({ src, message: e.message, diag: e.diagnostic || null }); return null; }
    }).filter(Boolean);
    const ready = (list) => list.filter((f) => f.sheets);
    const hr = run(ready(files.hr), (f) => E.parseHrFile(f.sheets, f.name, f.opts));
    const pay = run(ready(files.pay), (f) => E.parsePayrollFile(f.sheets, f.name, Object.assign({}, f.opts, { categoryOverrides: catOverrides })));
    let columns = [], err = null;
    try {
      const ms = [...new Set(pay.flatMap((x) => x.file.records.map((r) => r.pay_month)))];
      columns = pay.length ? E.unionColumns(E.catalogByMonth(pay.map((x) => x.file)), ms) : [];
    } catch (e) { err = e.message; }
    return { hr, pay, columns, failed, err };
  }, [files, catOverrides]);

  // 저장소 기준 매칭 결과 = 대시보드 데이터
  // 관리자만 전체 저장소(store)를 가짐 → 업로드 미리보기·누적 저장소 패널용. 담당자는 DB 가 권한대로 걸러 준 행만 받음
  const storeMatch = useMemo(() => (store ? matchStore(store, nameFallback) : null), [store, nameFallback]);
  const data = useMemo(() => (dbRows && dbRows.length ? { rows: dbRows, catalog: catalog || {} } : null), [dbRows, catalog]);

  // 미리보기: '지금 대기 중인 파일을 저장하면' 저장소가 어떻게 바뀌는지 (신규/갱신 건수 + 저장 후 매칭)
  const preview = useMemo(() => {
    if (!parsed.hr.length && !parsed.pay.length) return null;
    const staged = {
      hrFiles: parsed.hr.map((x) => ({ fileName: x.file.fileName, records: x.file.records })),
      payFiles: parsed.pay.map((x) => ({ fileName: x.file.fileName, records: x.file.records, columns: x.file.columns })),
    };
    try {
      const { store: next, report } = applyUpload(store || emptyStore(), staged);
      const months = [...new Set(report.flatMap((r) => Object.keys(r.byMonth)))].sort();
      return { next, report, months, match: matchStore(next, nameFallback) };
    } catch (e) { return { error: e.message }; }
  }, [parsed, store, nameFallback]);

  // RLS: 지금 보는 사람이 볼 수 있는 행
  const scopeRows = useMemo(() => (data ? data.rows.filter((r) => canView(r, viewer)) : []), [data, viewer]);
  const visibleMonths = useMemo(() => [...new Set(scopeRows.map((r) => r.pay_month))].sort().reverse(), [scopeRows]);

  // 보는 사람/데이터가 바뀌면: 볼 수 없는 귀속월은 선택 해제, 비면 최근 월
  useEffect(() => {
    setMonths((cur) => { const keep = cur.filter((m) => visibleMonths.includes(m)); return keep.length ? keep : visibleMonths.slice(0, 1); });
  }, [visibleMonths]);
  useEffect(() => { if (!isAdmin && tab !== 'dash' && data) setTab('dash'); }, [isAdmin, tab, data]);

  /** 바이트 → 시트. SheetJS 가 아직 없으면 sheets=null 로 '대기' (로딩되면 아래 effect 가 자동 처리) */
  function toItem(name, bytes) {
    const id = `${name}-${bytes.byteLength}-${Math.random().toString(36).slice(2, 7)}`;
    try { return { id, name, bytes, sheets: E.readWorkbook(bytes, name), opts: {} }; }
    catch (e) { if (isXlsxNotReady(e)) return { id, name, bytes, sheets: null, opts: {} }; throw e; }
  }
  /** 이미 바이트로 읽힌 항목들({ name, bytes })을 목록에 추가 — 업로드 파일과 샘플 데이터가 공통으로 사용 */
  function ingest(kind, sources) {
    const added = [], errors = [];
    for (const src of sources) {
      try { added.push(toItem(src.name, src.bytes)); }
      catch (e) { errors.push({ name: src.name, message: e.message.replace(/^\[[^\]]*\]\s*/, ''), guide: e.guide || null }); }
    }
    setLoadErrors((cur) => [...cur.filter((x) => !sources.some((s) => s.name === x.name)), ...errors]);
    setFiles((cur) => ({ ...cur, [kind]: [...cur[kind].filter((x) => !added.some((a) => a.name === x.name)), ...added] }));
  }
  /** 업로드(클릭·드래그) 파일: 먼저 FileReader 로 바이트를 확보한 뒤 ingest */
  async function addFiles(kind, fileList) {
    const list = Array.from(fileList || []);
    const sources = [], errors = [];
    for (const f of list) {
      try { sources.push({ name: f.name, bytes: await readFileBytes(f) }); }
      catch (e) { errors.push({ name: f.name, message: e.message, guide: e.guide || null }); }
    }
    if (errors.length) setLoadErrors((cur) => [...cur.filter((x) => !errors.some((y) => y.name === x.name)), ...errors]);
    if (sources.length) ingest(kind, sources);
  }
  function loadSample() {
    if (!xlsxReady) { setToast({ ok: false, text: '엑셀 분석 엔진(SheetJS)을 로딩 중입니다. 잠시 후 다시 시도해 주세요.' }); return; }
    const s = makeSampleFiles();
    setFiles({ hr: [], pay: [] }); setCatOverrides({}); setLoadErrors([]);
    ingest('hr', s.hr); ingest('pay', s.pay);
    setToast({ ok: true, text: `샘플 2개월치를 업로드 대기에 넣었습니다. 아래에서 확인 후 [누적 저장]을 누르세요. (10월 전배: ${s.note.mover} · 10월 급여 사번 오타: ${s.note.typo})` });
  }
  /** 업로드 상태 초기화: 올린 파일·오류·분류 수정값·파일 선택창을 모두 비움 (반영된 대시보드 데이터는 유지) */
  function resetUpload() {
    setFiles({ hr: [], pay: [] }); setLoadErrors([]); setCatOverrides({}); setNameFallback(true);
    setResetKey((k) => k + 1);
    setToast({ ok: true, text: '업로드 대기 중인 파일을 비웠습니다.' + (data ? ' 누적 저장된 데이터는 그대로입니다.' : '') });
  }
  // SheetJS 가 준비되면 대기 중인 파일을 자동 분석
  const pendingCount = files.hr.concat(files.pay).filter((x) => !x.sheets).length;
  useEffect(() => {
    if (!xlsxReady || !pendingCount) return;
    const errors = [];
    const conv = (arr) => arr.flatMap((it) => {
      if (it.sheets) return [it];
      try { return [{ ...it, sheets: E.readWorkbook(it.bytes, it.name) }]; }
      catch (e) { errors.push({ name: it.name, message: e.message.replace(/^\[[^\]]*\]\s*/, ''), guide: null }); return []; }
    });
    setFiles({ hr: conv(files.hr), pay: conv(files.pay) });
    if (errors.length) setLoadErrors((cur) => [...cur, ...errors]);
  }, [xlsxReady, pendingCount]);   // eslint-disable-line

  /** 누적 저장: 미리보기에서 계산한 새 저장소를 확정하고, 업로드 대기를 비움 */
  /** 누적 저장: 미리보기에서 계산한 결과를 귀속월 단위로 DB 에 반영 → 다시 불러오기 */
  async function commit() {
    if (!preview || !preview.next || saving) return;
    setSaving('저장 준비 중…');
    try {
      await onCommit(preview.next, preview.report, nameFallback, setSaving);
      const lines = preview.report.map((r) => `${r.kind === 'hr' ? '인원현황' : '급여대장'} ${r.fileName}: ` +
        Object.entries(r.byMonth).sort().map(([m, c]) => `${m} 신규 ${c.inserted}${c.updated ? ` · 갱신 ${c.updated}` : ''}`).join(', '));
      const payMonths = preview.report.filter((r) => r.kind === 'pay').flatMap((r) => Object.keys(r.byMonth)).sort();
      if (payMonths.length) { setMonths([payMonths[payMonths.length - 1]]); setFilters(blankDims()); }
      setFiles({ hr: [], pay: [] }); setLoadErrors([]); setCatOverrides({}); setResetKey((k) => k + 1);
      setToast({ ok: true, text: `서버(Supabase)에 저장했습니다 — ${lines.join(' / ')}. 팀원들도 새로고침하면 바로 보입니다.` });
      window.scrollTo(0, 0);
    } catch (e) {
      setToast({ ok: false, text: '저장하지 못했습니다: ' + koError(e) });
    } finally { setSaving(null); }
  }
  /** 전체 데이터 초기화: 서버의 인원현황·급여 데이터 모두 삭제 */
  async function resetAll() {
    try {
      await onResetAll();
      setFiles({ hr: [], pay: [] }); setLoadErrors([]); setCatOverrides({}); setResetKey((k) => k + 1);
      setMonths([]); setFilters(blankDims()); setTab('upload');
      setToast({ ok: true, text: '서버에 저장된 인원현황·급여 데이터를 모두 지웠습니다.' });
    } catch (e) { setToast({ ok: false, text: '초기화하지 못했습니다: ' + koError(e) }); }
  }
  async function removeMonth(m) {
    try { await onDeleteMonth(m); setToast({ ok: true, text: `${m} 귀속월의 인원현황·급여 데이터를 서버에서 삭제했습니다. 다른 귀속월은 그대로입니다.` }); }
    catch (e) { setToast({ ok: false, text: '삭제하지 못했습니다: ' + koError(e) }); }
  }
  function changeViewer(id) { setViewerId(id); setFilters(blankDims()); setToast(null); }

  const tabs = [['upload', '업로드 · 검증', !isAdmin], ['dash', '대시보드', !data], ['perm', '권한 설정', !isAdmin]];
  return html`
    <div className="min-h-screen font-sans text-[15px] leading-relaxed text-ink">
      <header className="border-b border-rule bg-sheet">
        <div className="mx-auto flex max-w-[1320px] flex-wrap items-end gap-x-6 px-5 pt-3">
          <div className="pb-3">
            <div className="text-[17px] font-bold tracking-tight">급여 · 인원 열람 대시보드</div>
            <div className="text-xs text-muted">올린 파일은 이 탭 메모리에서만 처리되며 어디에도 전송·저장되지 않습니다</div>
          </div>
          <${EngineBadge} st=${xlsx} />
          <div className="order-last mb-3 flex w-full flex-wrap items-center justify-end gap-2 text-[13px] md:order-none md:ml-auto md:w-auto">
            <span><b>${me.name}</b> <span className="text-muted">(${me.id})</span></span>
            <span className=${cx('rounded px-1.5 py-0.5 text-xs font-medium', me.role === 'admin' ? 'bg-ledger-tint text-ledger' : 'bg-sky-tint text-sky')}>${me.role === 'admin' ? '관리자' : '담당자'}</span>
            <button className="rounded border border-rule px-2 py-1 hover:border-ledger" onClick=${onChangePassword}>비밀번호 변경</button>
            <button className="rounded border border-rule px-2 py-1 hover:border-bad" onClick=${onLogout}>로그아웃</button>
          </div>
          <nav className="flex gap-1 md:ml-2" role="tablist">
            ${tabs.map(([k, t, dis]) => html`
              <button key=${k} role="tab" aria-selected=${tab === k} disabled=${dis}
                onClick=${() => { setTab(k); window.scrollTo(0, 0); }}
                className=${cx('border-b-[3px] px-4 pb-3 pt-2 font-medium disabled:cursor-not-allowed disabled:opacity-40',

      ${me.isMaster && me.defaultPw && html`

          <div className="mx-auto flex max-w-[1320px] flex-wrap items-center gap-3 px-5 py-2 text-[13.5px]">
            <span><b>마스터 계정이 기본 비밀번호를 사용 중입니다.</b> 이 비밀번호는 다른 사람도 알 수 있으니 바로 바꿔 주세요.</span>
            <button className="ml-auto rounded bg-warn px-3 py-1 font-semibold text-sheet" onClick=${onChangePassword}>지금 변경</button>
          </div>
        </div>`}
      <${ViewerStrip} users=${accounts} viewer=${viewer} canPreview=${me.role === 'admin'} me=${me} onChange=${changeViewer} data=${data} months=${months} scopeRows=${scopeRows} />

      <main className="mx-auto max-w-[1320px] px-5 pb-16 pt-6">
        ${toast && html`
          <div role="status" className=${cx('mb-4 flex items-start gap-3 rounded border px-3 py-2 text-sm', toast.ok ? 'border-ledger bg-ledger-tint' : 'border-bad bg-bad-tint')}>
            <span className="flex-1">${toast.text}</span>
            <button className="text-muted hover:text-ink" aria-label="알림 닫기" onClick=${() => setToast(null)}>×</button>
          </div>`}
        ${tab === 'upload' && html`<${UploadTab} files=${files} setFiles=${setFiles} addFiles=${addFiles} loadSample=${loadSample} parsed=${parsed}
            xlsx=${xlsx} xlsxReady=${xlsxReady} onReset=${resetUpload} resetKey=${resetKey}
            loadErrors=${loadErrors} dismissLoadError=${(n) => setLoadErrors((c) => c.filter((x) => x.name !== n))} nameFallback=${nameFallback} setNameFallback=${setNameFallback}
            catOverrides=${catOverrides} setCatOverrides=${setCatOverrides} onCommit=${commit}
            store=${store || emptyStore()} storeMatch=${storeMatch} preview=${preview} onResetAll=${resetAll} onDeleteMonth=${removeMonth} saving=${saving} />`}
        ${tab === 'dash' && data && html`<${Dashboard} data=${data} scopeRows=${scopeRows} visibleMonths=${visibleMonths} viewer=${viewer}
            months=${months} setMonths=${setMonths} filters=${filters} setFilters=${setFilters} groupBy=${groupBy} setGroupBy=${setGroupBy} setToast=${setToast} />`}
        ${tab === 'dash' && !data && html`<p className="rounded-md border border-rule bg-sheet px-4 py-10 text-center text-muted">
          ${isAdmin ? '아직 서버에 저장된 데이터가 없습니다. 업로드 · 검증 탭에서 파일을 올려 [누적 저장]을 눌러 주세요.' : '내 조회 범위 안에 아직 급여 데이터가 없습니다. 관리자가 데이터를 올리면 새로고침했을 때 여기에 표시됩니다.'}</p>`}
        ${tab === 'perm' && isAdmin && html`<${AccountsTab} accounts=${accounts} onUpdateAccount=${onUpdateAccount} me=${me} rows=${data ? data.rows : []} setToast=${setToast} invites=${invites} onSaveInvites=${onSaveInvites} onDeleteInvite=${onDeleteInvite} />`}
      </main>
    </div>`;
}

/* ───── 열람자 띠: 권한 분리 테스트의 핵심. 누구로 보고 있는지, 무엇이 보이는지 항상 표시 ───── */
function ViewerStrip({ users, viewer, canPreview, me, onChange, data, months, scopeRows }) {
  const all = data ? data.rows.filter((r) => months.includes(r.pay_month)) : [];
  const vis = scopeRows.filter((r) => months.includes(r.pay_month));
  const sum = (a) => a.reduce((s, r) => s + r.taxable_amt + r.non_taxable_amt, 0);
  return html`
    <section className="bg-ledger text-ledger-ink" aria-live="polite">
      <div className="mx-auto grid max-w-[1320px] items-center gap-x-7 gap-y-2 px-5 py-4 md:grid-cols-[auto_1fr_auto]">
        ${canPreview ? html`
          <label className="flex flex-col gap-1">
            <span className="text-xs opacity-85">${viewer.id === me.id ? '내 조회 범위 · 다른 사용자 화면 미리보기' : '미리보기 중 — 다른 사용자 화면'}</span>
            <select value=${viewer.id} onChange=${(e) => onChange(e.target.value)}
              className="min-w-[220px] rounded border border-current bg-transparent px-2.5 py-1.5 text-inherit [&>option]:text-[#17201C]">
              ${users.map((u) => html`<option key=${u.id} value=${u.id}>${u.id === me.id ? `${u.name} (나)` : `${u.name} (${u.id})`}${u.role === 'admin' ? ' · 관리자' : !u.grants.length ? ' · 승인 대기' : ''}</option>`)}
            </select>
          </label>` : html`
          <div className="flex flex-col gap-1"><span className="text-xs opacity-85">내 조회 범위</span><b className="text-[15px]">${me.name}</b></div>`}
        <div className="text-[21px] font-semibold leading-snug tracking-tight">
          ${viewer.role === 'admin' ? '전체 조회 — 모든 귀속월 · 급여지급기준 · 사업부 · 부문'
            : !viewer.grants.length ? '조회 권한 없음 — 아무 데이터도 보이지 않습니다'
            : viewer.grants.map((g, i) => html`<${Fragment} key=${i}>${i > 0 && html`<span className="mx-2 text-[15px] font-normal opacity-75">또는</span>`}${describeGrant(g)}<//>`)}
        </div>
        ${data && html`
          <div className="text-[13px] opacity-90 md:text-right">
            ${months.length ? `${months.length > 1 ? months.length + '개월' : months[0]}${canPreview ? ` · 전체 ${all.length.toLocaleString()}행 중` : ' · 내 조회 범위'}` : '귀속월 미선택'}
            <b className="block text-[21px] font-semibold opacity-100">${vis.length.toLocaleString()}행 · ${short(sum(vis))}원</b>
          </div>`}
      </div>
    </section>`;
}

/* ═════════════════════ 업로드 · 검증 ═════════════════════ */
function DropZone({ title, list, onFiles, onRemove }) {
  const [over, setOver] = useState(false);
  const [busy, setBusy] = useState(false);
  const input = useRef(null);
  // FileList 는 이벤트가 끝나면 비워질 수 있으므로(특히 drop 의 dataTransfer) 핸들러 안에서 즉시 배열로 복사
  async function handle(fileList, after) {
    const files = Array.from(fileList || []);
    if (!files.length) { if (after) after(); return; }
    setBusy(true);
    try { await onFiles(files); } finally { setBusy(false); if (after) after(); }
  }
  return html`
    <div onDragOver=${(e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; setOver(true); }}
      onDragLeave=${() => setOver(false)}
      onDrop=${(e) => { e.preventDefault(); setOver(false); handle(e.dataTransfer && e.dataTransfer.files); }}
      onClick=${() => !busy && input.current && input.current.click()} role="button" tabIndex="0" aria-busy=${busy}
      onKeyDown=${(e) => (e.key === 'Enter' || e.key === ' ') && input.current && input.current.click()}
      className=${cx('cursor-pointer rounded-md border-2 p-5', list.length ? 'border-solid border-ledger bg-ledger-tint' : 'border-dashed border-rule bg-sheet', over && 'border-ledger')}>
      <b className="block text-base">${title}</b>
      <span className="text-[13px] text-muted">${busy ? '파일을 읽는 중…' : 'Excel(.xlsx, .xls) 또는 CSV를 끌어 놓거나 눌러서 선택 · 여러 귀속월이면 여러 파일'}</span>
      <input ref=${input} type="file" multiple accept=".xlsx,.xls,.csv,.txt" className="hidden"
        onClick=${(e) => e.stopPropagation()}
        onChange=${(e) => { const el = e.target; handle(el.files, () => { el.value = ''; }); }} />
      ${list.length > 0 && html`
        <ul className="mt-3 flex flex-col gap-1">
          ${list.map((f) => html`
            <li key=${f.id} className="flex items-center justify-between gap-2 rounded border border-soft bg-sheet px-2 py-1 text-[13px]">
              <span className="truncate">${f.name}</span>
              <span className="ml-auto whitespace-nowrap text-xs text-muted">${(f.bytes.byteLength / 1024).toFixed(0)}KB${!f.sheets ? ' · 엔진 대기' : ''}</span>
              <button aria-label=${f.name + ' 제거'} className="text-muted hover:text-bad" onClick=${(e) => { e.stopPropagation(); onRemove(f.id); }}>×</button>
            </li>`)}
        </ul>`}
    </div>`;
}

/** 헤더의 엑셀 엔진 상태 표시 (실패 시 클릭하면 재시도) */
function EngineBadge({ st }) {
  const t = st.state === 'ready' ? ['엑셀 엔진 준비됨', 'bg-ledger-tint text-ledger', `SheetJS · ${st.host}`]
    : st.state === 'failed' ? ['엑셀 엔진 불러오기 실패 · 다시 시도', 'bg-bad-tint text-bad', '눌러서 다시 불러오기']
    : ['엑셀 엔진 불러오는 중…', 'bg-warn-tint text-warn', (st.tried || []).map((x) => x.url).join('\n')];
  return html`<button className=${cx('mb-3 rounded px-2 py-1 text-xs font-medium', t[1])} title=${t[2]}
    onClick=${() => st.state !== 'ready' && window.LibLoader.load('xlsx').catch(() => {})}>${t[0]}</button>`;
}

const ROW_ROLE = { label: '컬럼명', code: '코드명', meta: '타입 설명(제외)' };
const summarizeSkips = (list) => Object.entries(list.reduce((a, s) => { a[s.reason] = (a[s.reason] || 0) + 1; return a; }, {})).map(([k, n]) => `${k} ${n}`).join(', ');
const CONF = { inferred: ['추정', 'bg-sky-tint text-sky'], high: ['자동', 'bg-ledger-tint text-ledger'], low: ['확인 필요', 'bg-warn-tint text-warn'], manual: ['수동', 'bg-sky-tint text-sky'], missing: ['없음', 'bg-bad-tint text-bad'] };

function MappingPanel({ file, title, format, onOverride, onSheet }) {
  const cols = file.detection.columnLabels.map((l, i) => ({ i, t: l.filter(Boolean).join(' / ') })).filter((c) => c.t);
  const rows = file.detection.mapping.filter((m) => m.required || m.colIndex !== null || m.field === 'pay_month');
  return html`
    <section className="rounded-md border border-rule bg-sheet">
      <header className="flex flex-wrap items-center gap-3 border-b border-soft px-4 py-3">
        <span className="font-semibold">${title}</span><span className="text-[13px] text-muted">${file.fileName}</span>
        ${format && html`<span className="rounded bg-paper px-1.5 py-0.5 text-xs text-muted" title="파일 내용으로 판별한 실제 형식">${format}</span>`}
        ${file.sheetCandidates.length > 1 && html`
          <label className="ml-auto text-[13px]">시트${' '}
            <select className="rounded border border-rule px-1 py-0.5" value=${file.sheetName} onChange=${(e) => onSheet(e.target.value)}>
              ${file.sheetCandidates.map((s) => html`<option key=${s.name} value=${s.name}>${s.name} (필수 ${s.score}개 일치)</option>`)}
            </select>
          </label>`}
      </header>
      <p className="flex flex-wrap items-center gap-x-1.5 gap-y-1 px-4 pt-3 text-xs text-muted">
        ${(file.detection.headerRowRoles || []).map((h) => html`
          <span key=${h.row} className=${cx('rounded px-1.5 py-0.5', h.role === 'meta' ? 'bg-paper line-through decoration-muted' : 'bg-ledger-tint text-ledger')}>
            ${h.row + 1}행 ${ROW_ROLE[h.role]}</span>`)}
        <span>→ 데이터 ${file.detection.dataStart + 1}행부터 ${file.records.length.toLocaleString()}건</span>
        ${file.skippedRows.length > 0 && html`<span title=${summarizeSkips(file.skippedRows)}>· 제외 ${file.skippedRows.length}행 (${summarizeSkips(file.skippedRows)})</span>`}
      </p>
      <div className="overflow-x-auto px-2 pb-2">
        <table className="w-full text-[13.5px]">
          <thead><tr className="text-left text-xs text-muted"><th className="px-2 py-2 font-medium">항목</th><th className="px-2 font-medium">파일의 열</th><th className="px-2 font-medium">매칭 근거</th><th className="px-2 font-medium">상태</th></tr></thead>
          <tbody>
            ${rows.map((m) => { const conf = m.field === 'pay_month' && m.colIndex === null && file.records.length ? 'inferred' : m.confidence; return html`
              <tr key=${m.field} className="border-t border-soft">
                <td className="whitespace-nowrap px-2 py-1.5">${m.label}${m.required && html`<span className="text-bad"> *</span>`}</td>
                <td className="px-2">
                  <select className="w-56 max-w-full rounded border border-rule px-1 py-0.5" value=${m.colIndex ?? ''}
                    onChange=${(e) => onOverride(m.field, e.target.value === '' ? null : Number(e.target.value))}>
                    <option value="">— 사용 안 함 —</option>
                    ${cols.map((c) => html`<option key=${c.i} value=${c.i}>${c.t}</option>`)}
                  </select>
                </td>
                <td className="px-2 text-xs text-muted">${m.matchedBy || (m.field === 'pay_month' && file.records[0] ? `열 없음 → ${file.records[0].pay_month} (시트명·파일명·지정값)` : '')}</td>
                <td className="px-2"><span className=${cx('whitespace-nowrap rounded px-1.5 py-0.5 text-xs font-medium', CONF[conf][1])}>${CONF[conf][0]}</span></td>
              </tr>`; })}
          </tbody>
        </table>
      </div>
      ${file.detection.blockedColumns.length > 0 && html`
        <p className="border-t border-soft px-4 py-2 text-xs text-muted">민감정보 열(${file.detection.blockedColumns.map((b) => b.header).join(', ')})은 읽지 않고 버립니다.</p>`}
    </section>`;
}

/* ───── 매칭 상세 명단 (누적 저장소·저장 미리보기의 숫자를 누르면 열림) ───── */
const LIST_KIND = {
  emp_no: { title: '사번 매칭', desc: '사번과 귀속월이 모두 일치해 인원현황 소속이 결합된 사원' },
  name: { title: '성명 매칭', desc: '사번이 달라 성명 + 귀속월로 결합된 사원 — 동일인인지 확인하세요' },
  none: { title: '미매칭', desc: '그 달 인원현황에서 찾지 못한 급여 — 소속이 없어 관리자만 조회됩니다' },
  hr_only: { title: '인원현황만 (급여 없음)', desc: '그 달 인원현황에는 있지만 급여대장에 없는 사원 (휴직·퇴직·타법인 등)' },
};
const REASON_TEXT = { no_hr_month: '그 귀속월 인원현황 없음', other_month_only: '다른 귀속월 인원현황에만 있음', not_found: '인원현황에 사번·성명 모두 없음', name_ambiguous: '동명이인이라 성명 매칭 보류' };

/** 명단 구성: { title, desc, columns: [{ label, get, num }], rows } */
function buildList(match, kind, month) {
  const k = LIST_KIND[kind];
  const org = [
    { label: '급여지급기준', get: (r) => r.pay_basis || '–' }, { label: '사업부', get: (r) => (r.business_unit ? lab('business_unit', r.business_unit) : '–') },
    { label: '부문', get: (r) => r.division || '–' }, { label: '본부', get: (r) => r.hq || '–' }];
  const pay = { label: '지급합계', get: (r) => payOf(r), num: true };
  if (kind === 'hr_only') {
    const rows = match.hrOnly.filter((h) => h.pay_month === month).sort((a, b) => String(a.emp_no).localeCompare(String(b.emp_no)));
    return { ...k, rows, columns: [{ label: '사번', get: (r) => r.emp_no }, { label: '성명', get: (r) => r.emp_name }, ...org,
      { label: '재직상태', get: (r) => r.emp_status || '–' }, { label: '부서', get: (r) => r.dept || '–' }] };
  }
  const rows = match.merged.filter((r) => r.pay_month === month && r.match_method === kind)
    .sort((a, b) => payOf(b) - payOf(a));
  if (kind === 'emp_no') return { ...k, rows, columns: [{ label: '사번', get: (r) => r.emp_no }, { label: '성명', get: (r) => r.emp_name }, ...org, pay] };
  if (kind === 'name') return { ...k, rows, columns: [{ label: '급여 사번', get: (r) => r.emp_no }, { label: '인원현황 사번', get: (r) => r.hr_emp_no },
    { label: '성명(급여)', get: (r) => r.emp_name }, { label: '성명(인원현황)', get: (r) => r.hr_name }, ...org, pay] };
  // 미매칭: 원인 + 같은 달 인원현황에서 이름이 같은 후보
  const byName = new Map();
  match.hr.filter((h) => h.pay_month === month).forEach((h) => { const nk = E.nameKey(h.emp_name); byName.set(nk, [...(byName.get(nk) || []), h]); });
  return { ...k, rows, columns: [{ label: '급여 사번', get: (r) => r.emp_no }, { label: '성명', get: (r) => r.emp_name },
    { label: '급여대장 부서', get: (r) => r.dept || '–' }, { label: '원인', get: (r) => REASON_TEXT[r.unmatched_reason] || '–' },
    { label: '인원현황 후보(이름 같음)', get: (r) => (byName.get(E.nameKey(r.emp_name)) || []).map((h) => `${h.emp_no} ${h.emp_name}${h.business_unit ? ' · ' + h.business_unit : ''}`).join(', ') || '없음' },
    pay] };
}

function DataModal({ spec, month, onClose }) {
  const [q, setQ] = useState('');
  const [msg, setMsg] = useState(null);
  const closeRef = useRef(null);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey); if (closeRef.current) closeRef.current.focus();
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const qq = q.trim().toLowerCase();
  const rows = qq ? spec.rows.filter((r) => spec.columns.some((c) => String(c.get(r) ?? '').toLowerCase().includes(qq))) : spec.rows;
  async function saveXlsx() {
    try {
      const aoa = [spec.columns.map((c) => c.label), ...rows.map((r) => spec.columns.map((c) => c.get(r)))];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, makeSheet(aoa, { num: spec.columns.map((c, i) => (c.num ? i : -1)).filter((i) => i >= 0), widths: spec.columns.map((c) => (/후보/.test(c.label) ? 40 : 14)) }), spec.title.slice(0, 28));
      const name = `${month}_${spec.title.replace(/[^\w가-힣]+/g, '')}_명단.xlsx`;
      await saveFile(name, E.workbookToArray(wb)); setMsg(`${name} 저장 (${rows.length}명)`);
    } catch (e) { if (!e || e.code !== 'declined') setMsg('저장하지 못했습니다: ' + ((e && e.message) || (e && e.code) || e)); }
  }
  return html`
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div role="dialog" aria-modal="true" aria-labelledby="listdlg" className="flex max-h-[88vh] w-full max-w-[1080px] flex-col rounded-md border border-rule bg-sheet font-sans text-ink shadow-2xl">
        <header className="flex flex-wrap items-center gap-x-3 gap-y-1 border-b border-soft px-5 py-3">
          <h2 id="listdlg" className="text-[16px] font-semibold">${month} · ${spec.title} <span className="font-normal text-muted">${spec.rows.length.toLocaleString()}명</span></h2>
          <button ref=${closeRef} className="ml-auto rounded px-2 py-1 text-[20px] leading-none text-muted hover:bg-paper hover:text-ink" aria-label="닫기 (Esc)" onClick=${onClose}>×</button>
          <p className="w-full text-[12.5px] text-muted">${spec.desc}</p>
        </header>
        <div className="flex flex-wrap items-center gap-3 px-5 py-2.5">
          <input value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="사번 · 성명 · 소속 검색" aria-label="명단 검색" className="w-64 rounded border border-rule px-2 py-1.5 text-[13px]" />
          <span className="text-xs text-muted">${qq ? `${rows.length.toLocaleString()}명 표시` : ''}</span>
          ${msg && html`<span role="status" className="text-xs text-ledger">${msg}</span>`}
          <button onClick=${saveXlsx} disabled=${!rows.length} className="ml-auto rounded border border-ledger px-3 py-1.5 text-[13px] font-semibold text-ledger hover:bg-ledger-tint disabled:opacity-40">명단 엑셀 저장</button>
        </div>
        <div className="min-h-0 flex-1 overflow-auto border-t border-soft">
          ${spec.rows.length === 0 ? html`<p className="px-5 py-12 text-center text-muted">해당하는 사원이 없습니다.</p>` : html`
            <table className="w-full border-separate border-spacing-0 text-[13px]">
              <thead><tr>
                <th className="sticky top-0 z-10 border-b border-rule bg-paper px-3 py-2 text-left text-xs font-medium text-muted">#</th>
                ${spec.columns.map((c) => html`<th key=${c.label} className=${cx('sticky top-0 z-10 whitespace-nowrap border-b border-rule bg-paper px-3 py-2 text-xs font-medium text-muted', c.num ? 'text-right' : 'text-left')}>${c.label}</th>`)}
              </tr></thead>
              <tbody>${rows.slice(0, 2000).map((r, i) => html`
                <tr key=${i} className="hover:bg-paper">
                  <td className="border-b border-soft px-3 py-1.5 text-muted">${i + 1}</td>
                  ${spec.columns.map((c) => { const v = c.get(r); return html`<td key=${c.label}
                    className=${cx('border-b border-soft px-3 py-1.5', c.num ? 'whitespace-nowrap text-right tabular-nums' : /후보/.test(c.label) ? 'min-w-[220px]' : 'whitespace-nowrap',
                      c.label === '원인' && 'text-warn', /후보/.test(c.label) && v === '없음' && 'text-muted')}>${c.num ? won(v) : v}</td>`; })}
                </tr>`)}</tbody>
            </table>`}
          ${rows.length > 2000 && html`<p className="px-5 py-2 text-xs text-muted">화면에는 2,000명까지 표시합니다. 전체는 [명단 엑셀 저장]으로 받으세요.</p>`}
        </div>
      </div>
    </div>`;
}

/** 표 안의 숫자 → 누르면 명단 모달 */
const CountButton = ({ n, tone, onClick, label }) => (n ? html`<button onClick=${onClick} title=${`${label} 명단 보기`}
  className=${cx('rounded px-1.5 py-0.5 font-medium tabular-nums underline decoration-dotted underline-offset-2 hover:bg-ledger-tint', tone)}>${n.toLocaleString()}</button>` : '');

/** 누적 저장소 요약: 귀속월별 저장 건수·매칭 현황, 반영 이력, 귀속월 삭제, 전체 초기화 */
function StorePanel({ store, match, onResetAll, onDeleteMonth, onShowList }) {
  const hrN = Object.keys(store.hr).length;
  const payRows = Object.values(store.pay).reduce((n, x) => n + x.rows.length, 0);
  const files = store.uploads.filter((u) => u.kind !== 'delete').length;
  const months = match ? [...match.months].sort((a, b) => b.month.localeCompare(a.month)) : [];
  const lastFile = (m) => { for (let i = store.uploads.length - 1; i >= 0; i--) if (store.uploads[i].byMonth[m]) return store.uploads[i]; return null; };
  const time = (iso) => new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (!hrN && !payRows) {
    return html`<section className="rounded-md border border-dashed border-rule bg-sheet px-4 py-3 text-[13.5px] text-muted">
      <b className="text-ink">누적 저장소 (Supabase 서버)</b> — 아직 저장된 데이터가 없습니다. 파일을 올리고 [누적 저장]을 누르면 서버에 귀속월별로 쌓이고, 팀원들도 같은 데이터를 봅니다.</section>`;
  }
  return html`
    <section className="rounded-md border border-rule bg-sheet">
      <header className="flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-soft px-4 py-3">
        <b>누적 저장소</b>
        <span className="text-[13px] text-muted">귀속월 ${months.length}개 · 인원현황 ${hrN.toLocaleString()}건 · 급여 ${payRows.toLocaleString()}건 · 반영 파일 ${files}개</span>
        <span className="ml-auto"><${ConfirmButton} label="전체 데이터 초기화" confirmLabel="모두 지우기"
          className="rounded border border-bad px-3 py-1 text-[13px] text-bad hover:bg-bad-tint" onConfirm=${onResetAll} /></span>
      </header>
      <div className="overflow-x-auto">
        <table className="w-full text-[13.5px]">
          <thead><tr className="bg-paper text-xs text-muted">
            ${['귀속월', '인원현황', '급여', '사번 매칭', '성명 매칭', '미매칭', '인원현황만', '마지막 반영', ''].map((h, i) => html`<th key=${i} className=${cx('whitespace-nowrap px-3 py-2 font-medium', i > 0 && i < 7 ? 'text-right' : 'text-left')}>${h}</th>`)}
          </tr></thead>
          <tbody>
            ${months.map((x) => { const lf = lastFile(x.month); return html`
              <tr key=${x.month} className="border-b border-soft">
                <td className="px-3 py-1.5 font-semibold">${x.month}</td>
                <td className="px-3 text-right">${x.hr ? x.hr.toLocaleString() + '건' : html`<span className="text-bad">없음</span>`}</td>
                <td className="px-3 text-right">${x.payroll ? x.payroll.toLocaleString() + '건' : html`<span className="text-muted">없음</span>`}</td>
                <td className="px-3 text-right"><${CountButton} n=${x.payroll ? x.matched : 0} label="사번 매칭" onClick=${() => onShowList('emp_no', x.month)} /></td>
                <td className="px-3 text-right"><${CountButton} n=${x.byName} label="성명 매칭" tone="text-warn" onClick=${() => onShowList('name', x.month)} /></td>
                <td className="px-3 text-right"><${CountButton} n=${x.unmatched} label="미매칭" tone="text-bad" onClick=${() => onShowList('none', x.month)} /></td>
                <td className="px-3 text-right"><${CountButton} n=${x.payroll ? match.hrOnly.filter((h) => h.pay_month === x.month).length : 0} label="인원현황만" tone="text-muted" onClick=${() => onShowList('hr_only', x.month)} /></td>
                <td className="max-w-[320px] truncate px-3 text-xs text-muted" title=${lf ? lf.fileName : ''}>${lf ? `${time(lf.at)} · ${lf.fileName}` : ''}</td>
                <td className="px-3 text-right"><${ConfirmButton} label="삭제" confirmLabel=${x.month + ' 삭제'}
                  className="text-[13px] text-muted underline hover:text-bad" onConfirm=${() => onDeleteMonth(x.month)} /></td>
              </tr>`; })}
          </tbody>
        </table>
      </div>
      <details className="border-t border-soft px-4 py-2 text-[13px]">
        <summary className="cursor-pointer text-ledger underline">반영 이력 ${store.uploads.length}건 (최근 순)</summary>
        <ol className="mt-2 flex flex-col gap-1">
          ${[...store.uploads].reverse().map((u) => html`
            <li key=${u.seq} className="flex flex-wrap gap-x-2">
              <span className="text-muted">${time(u.at)}</span>
              <span className=${cx('rounded px-1.5 text-xs', u.kind === 'hr' ? 'bg-sky-tint text-sky' : u.kind === 'pay' ? 'bg-ledger-tint text-ledger' : 'bg-bad-tint text-bad')}>${u.kind === 'hr' ? '인원현황' : u.kind === 'pay' ? '급여대장' : '삭제'}</span>
              <span>${u.fileName}</span>
              <span className="text-muted">${Object.entries(u.byMonth).sort().map(([m, c]) => `${m} 신규 ${c.inserted}${c.updated ? ` · 갱신 ${c.updated}` : ''}`).join(' / ')}</span>
            </li>`)}
        </ol>
      </details>
      <p className="border-t border-soft px-4 py-2 text-xs text-muted">사번 매칭·성명 매칭·미매칭·인원현황만 숫자를 누르면 해당 사원 명단이 열립니다. 저장소는 Supabase 서버에 있어 팀원 모두가 같은 데이터를 봅니다(각자 권한 범위만).</p>
    </section>`;
}

function UploadTab({ files, setFiles, addFiles, loadSample, parsed, xlsx, xlsxReady, onReset, resetKey, loadErrors, dismissLoadError,
  nameFallback, setNameFallback, catOverrides, setCatOverrides, onCommit, store, storeMatch, preview, onResetAll, onDeleteMonth, saving }) {
  const pending = files.hr.concat(files.pay).filter((f) => !f.sheets);
  const update = (kind, id, fn) => setFiles((cur) => ({ ...cur, [kind]: cur[kind].map((x) => (x.id === id ? { ...x, opts: fn(x.opts) } : x)) }));
  const remove = (kind, id) => setFiles((cur) => ({ ...cur, [kind]: cur[kind].filter((x) => x.id !== id) }));
  const issues = [...parsed.hr.flatMap((x) => x.file.issues), ...parsed.pay.flatMap((x) => x.file.issues)]
    .sort((a, b) => ['error', 'warn', 'info'].indexOf(a.level) - ['error', 'warn', 'info'].indexOf(b.level));
  const blocking = parsed.failed.length > 0 || pending.length > 0 || issues.some((i) => i.code === 'MISSING_REQUIRED' || i.code === 'HR_MONTH_MISSING');
  const LV = { error: ['오류', 'border-bad bg-bad-tint'], warn: ['경고', 'border-warn bg-warn-tint'], info: ['안내', 'border-rule bg-paper'] };
  const REASON = { no_hr_month: '그 귀속월 인원현황 없음', other_month_only: '다른 귀속월에만 있음', not_found: '인원현황에 없음', name_ambiguous: '동명이인으로 보류' };
  const pm = preview && preview.match;
  const [listOpen, setListOpen] = useState(null);       // { kind, month, source: 'store' | 'preview' }
  const listMatch = listOpen ? (listOpen.source === 'preview' ? pm : storeMatch) : null;
  const affected = preview && preview.months ? preview.months : [];
  const inAffected = (r) => affected.includes(r.pay_month);

  return html`
    <div className="flex flex-col gap-4">
      <${StorePanel} store=${store} match=${storeMatch} onResetAll=${onResetAll} onDeleteMonth=${onDeleteMonth}
        onShowList=${(kind, month) => setListOpen({ kind, month, source: 'store' })} />
      ${listOpen && listMatch && html`<${DataModal} spec=${buildList(listMatch, listOpen.kind, listOpen.month)} month=${listOpen.month} onClose=${() => setListOpen(null)} />`}
      <h2 className="mt-2 text-[15px] font-semibold">새 파일 올리기 <span className="ml-1 text-[13px] font-normal text-muted">— 올린 파일은 ‘업로드 대기’에 머물다가 [누적 저장]을 눌러야 저장소에 합쳐집니다</span></h2>
      <div className="grid gap-4 md:grid-cols-2">
        <${DropZone} key=${'hr' + resetKey} title="인원현황 파일" list=${files.hr} onFiles=${(l) => addFiles('hr', l)} onRemove=${(id) => remove('hr', id)} />
        <${DropZone} key=${'pay' + resetKey} title="급여대장 파일" list=${files.pay} onFiles=${(l) => addFiles('pay', l)} onRemove=${(id) => remove('pay', id)} />
      </div>
      <div className="flex flex-wrap items-center gap-3 text-[13px] text-muted">
        <span>상단 행에서 컬럼 이름을 찾아 매칭하고, <b className="text-ink">사번 + 귀속월</b>이 같은 행끼리 결합합니다. 사번으로 못 찾으면 <b className="text-ink">성명 + 귀속월</b>로 보조 매칭합니다.</span>
        <div className="ml-auto flex gap-2">
          ${(files.hr.length > 0 || files.pay.length > 0 || loadErrors.length > 0) && html`
            <button className="rounded border border-rule bg-sheet px-3 py-1.5 text-ink hover:border-bad" onClick=${onReset} title="누적 저장된 데이터는 유지됩니다">업로드 대기 비우기</button>`}
          <button className="rounded border border-rule bg-sheet px-3 py-1.5 text-ink hover:border-ledger disabled:opacity-50" disabled=${!xlsxReady} onClick=${loadSample}>
            ${xlsxReady ? '파일 없이 샘플 데이터로 체험' : xlsx.state === 'failed' ? '엑셀 엔진 준비 안 됨' : '엑셀 엔진 로딩 중…'}</button>
        </div>
      </div>
      ${!xlsxReady && (pending.length > 0 || xlsx.state === 'failed') && html`<${XlsxNotice} xlsx=${xlsx} pending=${pending} onReset=${onReset} />`}
      ${loadErrors.map((x) => html`
        <section key=${x.name} role="alert" className="rounded-md border border-bad bg-sheet">
          <header className="flex items-center gap-3 border-b border-soft bg-bad-tint px-4 py-2.5">
            <b>파일을 열 수 없습니다</b><span className="text-[13px]">${x.name}</span>
            <button className="ml-auto rounded border border-rule bg-sheet px-2.5 py-1 text-[13px]" onClick=${onReset}>업로드 상태 초기화</button>

            <p>${x.message}</p>

          </div>
        </section>`)}
      ${parsed.err && html`<p role="alert" className="rounded border border-bad bg-bad-tint px-3 py-2 text-sm">${parsed.err}</p>`}
      ${parsed.failed.map((x) => html`<${DiagnosticPanel} key=${x.src.id} item=${x} onReset=${onReset} onRemove=${() => remove(files.hr.includes(x.src) ? 'hr' : 'pay', x.src.id)} />`)}

      ${parsed.hr.map(({ src, file: f }) => {
        const hasCol = f.detection.mapping.some((x) => x.field === 'pay_month' && x.colIndex !== null);
        return html`<${Fragment} key=${src.id}>
          ${!hasCol && html`
            <div className="flex flex-wrap items-center gap-3 rounded-md border border-warn bg-warn-tint px-4 py-2.5 text-[13.5px]">
              <span><b>${f.fileName}</b> 에는 귀속월 열이 없습니다. 이 파일의 모든 사원을 오른쪽 귀속월의 인원현황으로 저장합니다.</span>
              <label className="ml-auto">귀속월${' '}
                <input type="month" className="rounded border border-rule px-1.5 py-0.5" value=${src.opts.defaultMonth || (f.records[0] && f.records[0].pay_month) || ''}
                  onChange=${(e) => update('hr', src.id, (o) => ({ ...o, defaultMonth: e.target.value || undefined }))} />
              </label>
            </div>`}
          ${f.monthYear && html`
            <div className="flex flex-wrap items-center gap-3 rounded-md border border-warn bg-warn-tint px-4 py-2.5 text-[13.5px]">
              <span><b>${f.fileName}</b> 의 귀속월 값에 연도가 없어(예: '09') ${f.monthYear.source === 'option' ? '지정한 연도' : f.monthYear.source === 'name' ? '파일명·시트명의 연도' : '오늘 날짜 기준 연도'}${' '}
                <b>${f.monthYear.year}년</b>으로 해석했습니다 (${f.monthYear.rows.toLocaleString()}행). 다른 연도라면 바꿔 주세요.</span>
              <label className="ml-auto">귀속월 연도${' '}
                <input type="number" min="2000" max="2100" className="w-24 rounded border border-rule px-1.5 py-0.5" value=${src.opts.defaultYear || f.monthYear.year}
                  onChange=${(e) => { const y = parseInt(e.target.value, 10); update('hr', src.id, (o) => ({ ...o, defaultYear: y >= 2000 && y <= 2100 ? y : undefined })); }} />
              </label>
            </div>`}
          <${MappingPanel} file=${f} format=${src.sheets[0] && src.sheets[0].format} title=${`인원현황 · ${[...new Set(f.records.map((r) => r.pay_month))].sort().join(', ') || '귀속월 미정'}`}
            onOverride=${(field, col) => update('hr', src.id, (o) => ({ ...o, overrides: { ...(o.overrides || {}), [field]: col } }))}
            onSheet=${(name) => update('hr', src.id, () => ({ sheetName: name, overrides: {} }))} />
        <//>`;
      })}

/** 다중 선택 드롭다운. 선택지가 하나뿐이면(권한 범위상 단일값) '고정' 칩으로 표시 */
function MultiSelect({ label, hint, options, selected, onChange, allLabel = '전체', lock = null }) {
  const ref = useRef(null);
  useEffect(() => {
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) ref.current.open = false; };
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, []);
  if (lock) {
    return html`<div className="flex flex-col gap-1 text-[13px]"><span className="font-medium text-muted">${label}</span>
      <span className="rounded border border-dashed border-ledger bg-ledger-tint px-2.5 py-1.5" title="내 조회 권한으로 고정된 항목입니다">${lock.label} <span className="text-xs text-ledger">권한 고정</span></span></div>`;
  }
  const text = !selected.length ? allLabel : selected.length === 1 ? ((options.find((o) => o.value === selected[0]) || {}).label || selected[0]) : `${selected.length}개 선택`;
  const toggle = (v) => onChange(selected.includes(v) ? selected.filter((x) => x !== v) : [...selected, v]);
  return html`
    <details ref=${ref} className="relative text-[13px]">
      <summary className="flex cursor-pointer flex-col gap-1">
        <span className="font-medium text-muted">${label}</span>
        <span className="relative min-w-[150px] rounded border border-rule bg-sheet py-1.5 pl-2.5 pr-7">${text}
          <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] text-muted">▼</span></span>
      </summary>
      <div className="absolute left-0 z-30 mt-1 max-h-80 w-72 overflow-auto rounded border border-rule bg-sheet p-1.5 shadow-xl">
        ${hint && html`<p className="px-1.5 pb-1 text-xs text-muted">${hint}</p>`}
        <div className="flex gap-3 px-1.5 pb-1 text-xs">
          <button className="text-ledger underline" onClick=${(e) => { e.preventDefault(); onChange(options.map((o) => o.value)); }}>모두 선택</button>
          <button className="text-ledger underline" onClick=${(e) => { e.preventDefault(); onChange([]); }}>선택 해제</button>
        </div>
        ${options.map((o) => html`
          <label key=${o.value} className="flex cursor-pointer items-center justify-between gap-2 rounded px-1.5 py-1 hover:bg-paper">
            <span className="flex items-center gap-2"><input type="checkbox" checked=${selected.includes(o.value)} onChange=${() => toggle(o.value)} />${o.label}</span>
            ${o.count != null && html`<span className="text-xs text-muted">${o.count}명</span>`}
          </label>`)}
      </div>
    </details>`;
}

function Dashboard({ data, scopeRows, visibleMonths, viewer, months, setMonths, filters, setFilters, groupBy, setGroupBy, setToast }) {
  const inMonths = useMemo(() => scopeRows.filter((r) => months.includes(r.pay_month)), [scopeRows, months]);
  // 필터 선택지: 내가 볼 수 있는 행(권한 범위 ∩ 선택 귀속월)에 있는 값만
  const options = useMemo(() => {
    const o = {};
    DIMS.forEach((d) => {
      const map = new Map();
      inMonths.forEach((r) => { if (r[d.key] != null) { const s = map.get(r[d.key]) || new Set(); s.add(r.emp_no); map.set(r[d.key], s); } });
      o[d.key] = [...map].sort((a, b) => b[1].size - a[1].size).map(([v, s]) => ({ value: v, label: lab(d.key, v), count: s.size }));
    });
    return o;
  }, [inMonths]);
  const rows = useMemo(() => inMonths.filter((r) => DIMS.every((d) => !filters[d.key].length || filters[d.key].includes(r[d.key]))), [inMonths, filters]);
  const summary = useMemo(() => E.summarize(rows, groupBy, lab), [rows, groupBy]);
  // 보고용 분석: 추이는 '보유한 모든 귀속월'(권한 범위 ∩ 분류 필터), 비중은 '선택한 귀속월'
  const dimRows = useMemo(() => scopeRows.filter((r) => DIMS.every((d) => !filters[d.key].length || filters[d.key].includes(r[d.key]))), [scopeRows, filters]);
  const bonusKeys = useMemo(() => bonusKeysOf(data.catalog), [data.catalog]);
  const trend = useMemo(() => monthlyTrend(dimRows, bonusKeys), [dimRows, bonusKeys]);
  const latest = months.length ? [...months].sort().reverse()[0] : null;
  const prev = (trend.find((a) => a.month === latest) || {}).prevMonth || null;
  const share = useMemo(() => orgShare(rows, dimRows, groupBy, latest, prev), [rows, dimRows, groupBy, latest, prev]);
  // 권한 설정에 지정된 항목만 '권한 고정' (데이터에 값이 하나뿐이라고 고정하지 않음)
  const locks = useMemo(() => grantLocks(viewer), [viewer]);
  const freeDims = DIMS.filter((d) => !locks[d.key]).map((d) => d.label);
  const columns = useMemo(() => E.unionColumns(data.catalog, months), [data.catalog, months]);
  const gl = DIMS.find((d) => d.key === groupBy).label;

  if (!visibleMonths.length) {
    return html`<p className="rounded-md border border-rule bg-sheet px-4 py-10 text-center text-muted">
      ${viewer.grants.length || viewer.role === 'admin' ? '조회 범위 안에 급여 데이터가 없습니다.' : '조회 권한이 없습니다. HR 관리자에게 필요한 범위를 요청하세요.'}</p>`;
  }
  const tot = rows.reduce((a, r) => ({ tax: a.tax + r.taxable_amt, nt: a.nt + r.non_taxable_amt, b: a.b + (r.bonus_amt || 0), d: a.d + (r.deduction_amt || 0), net: a.net + (r.net_pay_amt || 0) }), { tax: 0, nt: 0, b: 0, d: 0, net: 0 });
  const heads = months.reduce((s, m) => s + new Set(rows.filter((r) => r.pay_month === m).map((r) => r.emp_no)).size, 0);
  const totalPay = tot.tax + tot.nt;
  const lt = trend.find((a) => a.month === latest);
  const kpis = [
    [months.length > 1 ? `연인원 (${months.length}개월 합)` : '급여 지급 인원', heads.toLocaleString() + '명', '', null],
    ['지급합계', short(totalPay) + '원', won(totalPay) + '원', lt && lt.mom != null ? { v: lt.mom, t: `${latest} 기준 전월(${prev}) 대비` } : null],
    ['1인당 월평균 지급', short(heads ? totalPay / heads : 0) + '원', `${won(heads ? totalPay / heads : 0)}원 = 지급합계 ÷ 연인원`, null],
    ['과세총액', short(tot.tax) + '원', won(tot.tax) + '원', null], ['비과세총액', short(tot.nt) + '원', won(tot.nt) + '원', null],
    ['상여총액', short(tot.b) + '원', won(tot.b) + '원', null], ['차인지급액', short(tot.net) + '원', won(tot.net) + '원', null]];
  const reportExtra = () => reportSheets(trend, share, gl, months, latest, prev);
  async function exportReport() {
    try {
      const meta = exportMeta(viewer, months, filters);
      const summary = [['항목', '내용'], ['작성자', viewer.name], ['작성 시각', new Date().toLocaleString('ko-KR')], ['조회 권한 범위', meta.scopeText], ['적용 필터', meta.filterText],
        ['분석 기간(추이)', trend.length ? `${trend[0].month} ~ ${trend[trend.length - 1].month}` : ''], ['선택 귀속월', [...months].sort().join(', ')],
        ['인원(연인원)', heads], ['지급합계', totalPay], ['1인당 월평균 지급', Math.round(heads ? totalPay / heads : 0)], ['과세총액', tot.tax], ['비과세총액', tot.nt],
        ['상여총액', tot.b], ['공제합계', tot.d], ['차인지급액', tot.net], [`지급합계 전월 대비 (${latest} vs ${prev || '-'})`, lt && lt.mom != null ? lt.mom : '비교 불가'],
        ['안내', '이 파일에는 개인별 급여가 없고 집계값만 들어 있습니다. 조직별 비중의 1인당 월평균 = 지급합계 ÷ 연인원.']];
      const ws = makeSheet(summary, { widths: [26, 70] });
      for (let r = 7; r <= 14; r++) { const c = ws[XLSX.utils.encode_cell({ r, c: 1 })]; if (c && c.t === 'n') c.z = '#,##0'; }
      const mc = ws[XLSX.utils.encode_cell({ r: 15, c: 1 })]; if (mc && mc.t === 'n') mc.z = '0.0%';
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '보고 요약');
      reportExtra().forEach((x) => XLSX.utils.book_append_sheet(wb, x.ws, x.name));
      const name = E.exportFileName(months, meta.scopeShort).replace('급여대장_', '인건비보고_');
      await saveFile(name, E.workbookToArray(wb));
      setToast({ ok: true, text: `${name} — 보고 요약 · 월별 추이(${trend.length}개월) · ${gl}별 비중(${share.length}개). 개인별 급여는 포함하지 않았습니다.` });
    } catch (e) { saveErrorToast(e, setToast); }
  }
  let lastMonth = null;

  return html`
    <div className="flex flex-col gap-4">
      <section aria-label="조회 조건" className="flex flex-wrap items-end gap-x-5 gap-y-3 rounded-md border border-rule bg-sheet p-4">
        <${MultiSelect} label="귀속월" options=${visibleMonths.map((m) => ({ value: m, label: m }))} selected=${months} allLabel="선택하세요"
          onChange=${(v) => { setMonths([...v].sort().reverse()); setFilters(blankDims()); }} />
        ${DIMS.map((d) => html`<${MultiSelect} key=${d.key} label=${d.label} hint=${d.hint} options=${options[d.key]} selected=${filters[d.key]}
          lock=${locks[d.key] || null} onChange=${(v) => setFilters({ ...filters, [d.key]: v })} />`)}

          <legend className="mb-1 font-medium text-muted">집계 기준</legend>
          <div className="inline-flex overflow-hidden rounded border border-rule" role="radiogroup">
            ${DIMS.map((d, i) => html`<button key=${d.key} role="radio" aria-checked=${groupBy === d.key} onClick=${() => setGroupBy(d.key)}
              className=${cx('px-3 py-1.5', i && 'border-l border-rule', groupBy === d.key ? 'bg-ink text-paper' : 'bg-sheet hover:bg-paper')}>${d.label}</button>`)}
          </div>

        ${DIMS.some((d) => filters[d.key].length) && html`<button className="ml-auto text-[13px] text-ledger underline" onClick=${() => setFilters(blankDims())}>분류 필터 초기화</button>`}
        ${viewer.role !== 'admin' && html`
          <p className="w-full border-t border-soft pt-2 text-xs text-muted">
            <b className="text-ink">내 권한:</b> ${viewer.grants.map(describeGrant).join(' 또는 ')}
            ${freeDims.length > 0 && html` · 자유 선택: <b className="text-ink">${freeDims.join('·')}</b> (권한 범위 안의 값만 표시)`}
            ${viewer.grants.length > 1 && ' · 여러 권한 중 하나라도 해당하면 조회됩니다'}
          </p>`}
      </section>

      ${!months.length ? html`<p className="rounded-md border border-rule bg-sheet px-4 py-8 text-center text-muted">귀속월을 하나 이상 선택하세요.</p>` : html`

                    const first = s.pay_month !== lastMonth; lastMonth = s.pay_month;
                    return html`<tr key=${s.pay_month + (s.group ?? '_') + (s.isSubtotal ? 'T' : '')}
                      onClick=${() => !s.isSubtotal && s.group != null && setFilters({ ...filters, [groupBy]: [s.group] })}

                    </tr>`;
                  })}
                  ${!summary.length && html`<tr><td colSpan="10" className="px-3 py-8 text-center text-muted">조건에 맞는 급여 데이터가 없습니다. 필터를 줄여 보세요.</td></tr>`}
